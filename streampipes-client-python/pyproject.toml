[project]
name = "streampipes"
description = "Python library for Apache StreamPipes"
license = "Apache-2.0"
authors = [
    { name = "Apache Software Foundation", email = "dev@streampipes.apache.org" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "confluent-kafka>=2.0.2,<3",
    "nats-py>=2.2,<3",
    "pandas>=2.3,<3",
    "pydantic>=2.6.3,<3.0.0",
    "requests>=2.28,<3",
    "typing-extensions>=4.5,<5"
]
dynamic = ["version"]
readme = "README.md"
keywords = [
    "streampipes",
    "iot",
    "iiot",
    "analytics",
    "stream-processing",
    "apache",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]

[project.urls]
Homepage = "https://streampipes.apache.org/docs/docs/python/latest/"
Repository = "https://github.com/apache/streampipes"
Documentation = "https://streampipes.apache.org/docs/docs/python/latest/"

[tool.poetry]
version = "0.0.0"  # gets overwritten in CI pipeline

include = [
    { path = "streampipes/py.typed" }
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
autoflake = "2.3.0"
black = "26.5.0"
blacken-docs = "1.20.0"
flake8 = "7.3.0"
interrogate = "1.7.0"
isort = "8.0.1"
mypy = "2.1.0"
ruff = "0.15.8"
pre-commit = "4.6.0"
pytest = "9.1.0"
pytest-cov = "7.1.0"
pyupgrade = "3.21.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mike = { git = "https://github.com/jimporter/mike.git", rev = "872f72def32f588908f8251fe512189e0c41f4e2" }
mkdocs = "1.5.3"
mkdocs-awesome-pages-plugin = "2.10.1"
mkdocs-gen-files = "0.6.1"
mkdocs-git-revision-date-localized-plugin = "1.5.1"
mkdocs-jupyter = "0.26.1"
mkdocs-literate-nav = "0.6.0"
mkdocs-material = "9.5.18"
mkdocstrings = { version = "0.25.0", extras = ["python"] }
numpydoc = "1.10.0"
pytkdocs = { version = "0.16.1", extras = ["numpy-style"] }
setuptools = "80.9.0"

[tool.poetry.group.stubs]
optional = true

[tool.poetry.group.stubs.dependencies]
types-Jinja2 = "2.11.9"
types-requests = "2.33.0.20260402"

[tool.poetry.group.deployment]
optional = true

[tool.poetry.group.deployment.dependencies]
twine = "6.2.0"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.autoflake]
remove-all-unused-imports = true
expand-star-imports = true
in-place = true
remove-unused-variables = true
remove-duplicate-keys = true

[tool.black]
line-length = 120

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-module = true
fail-under = 100
ignore-regex = ["test_*", "Test*", ".*BaseClass.*"]
verbose = 2 # possible values: 0 (minimal output), 1 (-v), 2 (-vv)
omit-covered-files = true
generate-badge = "./streampipes-client-python/docs/img"
badge-style = "flat"

[tool.isort]
profile = "black"
src_paths = ["streampipes", "tests"]

[tool.mypy]
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
