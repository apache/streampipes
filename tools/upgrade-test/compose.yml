services:
  backend:
    stop_grace_period: 60s
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    ports:
      - "127.0.0.1::8030"
    environment:
      SP_INITIAL_SERVICE_USER_SECRET: ${SP_SERVICE_SECRET}
      SP_CLIENT_SECRET: ${SP_SERVICE_SECRET}
      SP_PRIORITIZED_PROTOCOL: nats
    volumes:
      - backend:/root/.streampipes
    depends_on:
      - couchdb
      - influxdb
      - nats
  extensions-all-iiot:
    stop_grace_period: 60s
    image: ${EXTENSIONS_IMAGE:?Set EXTENSIONS_IMAGE}
    environment:
      SP_CLIENT_SECRET: ${SP_SERVICE_SECRET}
  couchdb:
    image: couchdb:3.5.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    volumes:
      - couchdb:/opt/couchdb/data
  nats:
    image: nats:2.15-alpine
  influxdb:
    image: influxdb:2.6
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: sp-admin
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: sp-admin
      DOCKER_INFLUXDB_INIT_ORG: sp
      DOCKER_INFLUXDB_INIT_BUCKET: sp
    volumes:
      - influxdb:/var/lib/influxdb2

volumes:
  backend:
  couchdb:
  influxdb:
