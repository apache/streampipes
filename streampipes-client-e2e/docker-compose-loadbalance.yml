# global logging
x-logging: &default-logging
  options:
    max-size: "12m"
    max-file: "5"
  driver: json-file

services:
  #### apache/streampipes
  backend:
    image: streampipes_backend:release-validation
    hostname: backend
    ports:
      - "8030:8030"
    depends_on:
      - couchdb
    environment:
      - SP_LOAD_MANAGER_ENABLE=true
      - SP_SELECTOR=WeightedRandomSelector
      - SP_MIGRATOR=ThresholdMigrator
      - SP_INITIAL_SERVICE_USER=sp-service-client
      - SP_INITIAL_SERVICE_USER_SECRET=my-apache-streampipes-secret-key-change-me
      - SP_CLIENT_USER=sp-service-client
      - SP_CLIENT_SECRET=my-apache-streampipes-secret-key-change-me
      # Other selector options:
      # - SP_SELECTOR=WeightedRandomSelector
      # - SP_SELECTOR=MinimumLoadSelector
      # Other Migrator options:
      # - SP_MIGRATOR=TransferMigrator
      # - SP_MIGRATOR=OverloadMigrator
    volumes:
      - backend:/root/.streampipes
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8030"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    logging: *default-logging
    networks:
      spnet:

  extensions-all-jvm-1:
    image: streampipes_pipeline-elements-all-jvm:release-validation
    hostname: extensions-all-jvm-1
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - SP_CORE_SCHEME=http
      - SP_CORE_HOST=backend
      - SP_CORE_PORT=8030
      - SP_CLIENT_USER=sp-service-client
      - SP_CLIENT_SECRET=my-apache-streampipes-secret-key-change-me
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8090"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    logging: *default-logging
    networks:
      spnet:

  extensions-all-jvm-2:
    image: streampipes_pipeline-elements-all-jvm:release-validation
    hostname: extensions-all-jvm-2
    depends_on:
      extensions-all-jvm-1:
        condition: service_healthy
    environment:
      - SP_CORE_SCHEME=http
      - SP_CORE_HOST=backend
      - SP_CORE_PORT=8030
      - SP_CLIENT_USER=sp-service-client
      - SP_CLIENT_SECRET=my-apache-streampipes-secret-key-change-me
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8090"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    logging: *default-logging
    networks:
      spnet:

  extensions-all-jvm-3:
    image: streampipes_pipeline-elements-all-jvm:release-validation
    hostname: extensions-all-jvm-3
    depends_on:
      extensions-all-jvm-2:
        condition: service_healthy
    environment:
      - SP_CORE_SCHEME=http
      - SP_CORE_HOST=backend
      - SP_CORE_PORT=8030
      - SP_CLIENT_USER=sp-service-client
      - SP_CLIENT_SECRET=my-apache-streampipes-secret-key-change-me
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8090"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    logging: *default-logging
    networks:
      spnet:

  couchdb:
    image: couchdb:2.3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    logging: *default-logging
    volumes:
      - couchdb:/opt/couchdb/data
    networks:
      spnet:

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,OUTSIDE://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,OUTSIDE://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,OUTSIDE:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_MESSAGE_MAX_BYTES=5000012
      - KAFKA_REPLICA_FETCH_MAX_BYTES=10000000
      - KAFKA_FETCH_MESSAGE_MAX_BYTES=5000012
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
    volumes:
      - kafka3:/var/lib/kafka/data
    logging: *default-logging
    networks:
      spnet:

  nats:
    image: nats:2.10-alpine
    hostname: nats
    ports:
      - "4222:4222"
    logging: *default-logging
    networks:
      spnet:


  influxdb:
    image: influxdb:2.6
    environment:
      - INFLUXDB_DATA_ENGINE=tsm1
      - INFLUXDB_REPORTING_DISABLED=false
      - INFLUXDB_ADMIN_ENABLED=true
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=sp-admin
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sp-admin
      - DOCKER_INFLUXDB_INIT_ORG=sp
      - DOCKER_INFLUXDB_INIT_BUCKET=sp
      - DOCKER_INFLUXDB_INIT_MODE=setup
    volumes:
      - influxdb:/var/lib/influxdb
      - influxdb2:/var/lib/influxdb2
    logging: *default-logging
    networks:
      spnet:

  mosquitto:
    image: eclipse-mosquitto:1.5.4
    logging: *default-logging
    networks:
      spnet:

  opcua:
    image: mcr.microsoft.com/iotedge/opc-plc
    logging: *default-logging
    command: --ut=true
    networks:
      spnet:

volumes:
  kafka3:
  couchdb:
  zookeeper:
  influxdb:
  influxdb2:
  backend:
  nginx:

networks:
  spnet:
    name: spnet
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
