# global logging
x-logging: &default-logging
  options:
    max-size: "12m"
    max-file: "5"
  driver: json-file

services:
  #### apache/streampipes
  backend:
    image: streampipes_backend:release-validation
    ports:
      - "8030:8030"
    environment:
      - SP_INITIAL_SERVICE_USER_SECRET=${SP_SERVICE_SECRET:?Generate and export SP_SERVICE_SECRET before starting}
      - SP_CLIENT_SECRET=${SP_SERVICE_SECRET:?Generate and export SP_SERVICE_SECRET before starting}
      - SP_PRIORITIZED_PROTOCOL=nats
    depends_on:
      - couchdb
    volumes:
      - backend:/root/.streampipes
    logging: *default-logging
    networks:
      spnet:

  extensions-all-jvm:
    image: streampipes_pipeline-elements-all-jvm:release-validation
    environment:
      - SP_CLIENT_SECRET=${SP_SERVICE_SECRET:?Generate and export SP_SERVICE_SECRET before starting}
    logging: *default-logging
    networks:
      spnet:

  couchdb:
    image: couchdb:2.3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    logging: *default-logging
    volumes:
      - couchdb:/opt/couchdb/data
    networks:
      spnet:

  nats:
    image: nats:2.10-alpine
    hostname: nats
    ports:
      - "4222:4222"
    logging: *default-logging
    networks:
      spnet:


  influxdb:
    image: influxdb:2.6
    environment:
      - INFLUXDB_DATA_ENGINE=tsm1
      - INFLUXDB_REPORTING_DISABLED=false
      - INFLUXDB_ADMIN_ENABLED=true
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=sp-admin
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sp-admin
      - DOCKER_INFLUXDB_INIT_ORG=sp
      - DOCKER_INFLUXDB_INIT_BUCKET=sp
      - DOCKER_INFLUXDB_INIT_MODE=setup
    volumes:
      - influxdb:/var/lib/influxdb
      - influxdb2:/var/lib/influxdb2
    logging: *default-logging
    networks:
      spnet:

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ../installer/cli/deploy/standalone/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    logging: *default-logging
    networks:
      spnet:

  opcua:
    image: mcr.microsoft.com/iotedge/opc-plc
    logging: *default-logging
    command: --ut=true
    networks:
      spnet:

volumes:
  couchdb:
  zookeeper:
  influxdb:
  influxdb2:
  backend:
  nginx:

networks:
  spnet:
    name: spnet
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
