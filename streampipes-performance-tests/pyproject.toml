[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streampipes-performance"
version = "0.1.0"
description = "Isolated, configurable performance test runs against Apache StreamPipes"
requires-python = ">=3.11.5"
license = "Apache-2.0"
authors = [
    { name = "Apache Software Foundation", email = "dev@streampipes.apache.org" }
]
# Compact adapter/pipeline APIs need the client from this repository
# (../streampipes-client-python); install it alongside this package.
dependencies = [
    "streampipes",
    "pydantic>=2.6,<3",
    "nats-py>=2.6,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov"]

[project.urls]
Repository = "https://github.com/apache/streampipes"

[project.scripts]
sp-performance = "streampipes_performance.cli:main"

[tool.setuptools.packages.find]
include = ["streampipes_performance*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html"]

[tool.setuptools.data-files]
"share/streampipes-performance/run_configs" = ["run_configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
