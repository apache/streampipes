<sp-split-section [level]="3" [title]="'Download Format' | translate">
    <mat-radio-group
        class="sp-radio-group"
        [(ngModel)]="formatExportConfig.format"
    >
        <mat-radio-button
            value="json"
            class="sp-radio-button"
            [attr.data-cy]="dataCyPrefix + '-json'"
        >
            JSON
        </mat-radio-button>
        <mat-radio-button
            value="csv"
            class="sp-radio-button"
            [attr.data-cy]="dataCyPrefix + '-csv'"
        >
            CSV
        </mat-radio-button>
        <mat-radio-button
            value="xlsx"
            class="sp-radio-button"
            [attr.data-cy]="dataCyPrefix + '-xlsx'"
        >
            EXCEL (XLSX)
        </mat-radio-button>
    </mat-radio-group>
</sp-split-section>

@if (formatExportConfig.format === 'csv') {
    <sp-split-section [level]="3" [title]="'Delimiter' | translate">
        <mat-radio-group
            [(ngModel)]="formatExportConfig.delimiter"
            class="sp-radio-group"
        >
            <mat-radio-button
                value="comma"
                class="sp-radio-button"
                [attr.data-cy]="delimiterDataCyPrefix + '-delimiter-comma'"
                >,</mat-radio-button
            >
            <mat-radio-button
                value="semicolon"
                class="sp-radio-button"
                [attr.data-cy]="delimiterDataCyPrefix + '-delimiter-semicolon'"
                >;</mat-radio-button
            >
        </mat-radio-group>
    </sp-split-section>
}
