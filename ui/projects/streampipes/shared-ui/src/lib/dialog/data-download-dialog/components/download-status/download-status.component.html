<div fxFlex="100">
    @if (downloading) {
        <div fxLayout="column" fxLayoutAlign="center center" class="mt-35">
            <mat-spinner [diameter]="30" color="accent" />
            @if (downloadedMBs !== undefined) {
                <label>{{ downloadedMBs | number: '1.0-2' }} Mb</label>
            }
            @if (cancelable) {
                <button
                    mat-button
                    class="btn-warn"
                    (click)="downloadCancelled.emit()"
                >
                    {{ 'Cancel' | translate }}
                </button>
            }
        </div>
    } @else if (failed) {
        <div fxLayout="column" fxLayoutAlign="center center">
            <mat-icon class="download-error-icon">error</mat-icon>
            <p class="download-error" role="alert">
                {{ errorMessage | translate }}
            </p>
        </div>
    } @else if (finished) {
        <div fxLayout="column" fxLayoutAlign="center center">
            <mat-icon class="icon-check">check</mat-icon>
            <h5>{{ 'Download successful' | translate }}</h5>
        </div>
    }
</div>
