<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15 flex-col">
        <div class="flex-row flex-100">
            <div class="flex-col flex-1">
                <div class="flex-row flex-wrap items-center content-center">
                    <h4 class="element-title">{{ pipelineElement.name }}</h4>
                    @if (assetContext) {
                        <div class="asset-context ml-sm flex-row items-center">
                            <div
                                class="asset-context-boxes flex-row flex-wrap items-center content-center gap-md"
                            >
                                @for (
                                    asset of assetContext.assets;
                                    track asset.id
                                ) {
                                    <sp-label
                                        size="small"
                                        tone="neutral"
                                        variant="soft"
                                        [labelText]="asset.label"
                                        [matTooltip]="asset.tooltip"
                                    >
                                    </sp-label>
                                }
                            </div>
                        </div>
                    }
                </div>
                <small>
                    {{ pipelineElement.description }}
                </small>
            </div>
            <sp-element-id
                class="flex-row justify-end items-start"
                [value]="
                    isDataStream
                        ? pipelineElement.elementId
                        : pipelineElement.appId
                "
            >
            </sp-element-id>
        </div>
        <mat-tab-group
            color="accent"
            [selectedIndex]="selectedTabIndex"
            (selectedIndexChange)="selectedTabIndex = $event"
        >
            @for (tab of tabs; track tab) {
                <mat-tab label="{{ tab }}"></mat-tab>
            }
        </mat-tab-group>

        @if (selectedTabIndex === 0 && pipelineElement) {
            <sp-pipeline-element-runtime-info
                [showTitle]="false"
                [streamDescription]="dataStream"
            ></sp-pipeline-element-runtime-info>
        }
        @if (selectedTabIndex === 1) {
            <sp-pipeline-element-documentation
                [useStyling]="false"
                [appId]="pipelineElement.appId"
            ></sp-pipeline-element-documentation>
        }
    </div>

    <mat-divider></mat-divider>

    <div class="sp-dialog-actions actions-align-right">
        <button mat-button mat-flat-button class="mat-basic" (click)="close()">
            {{ 'Close' | translate }}
        </button>
    </div>
</div>
