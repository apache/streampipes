<div
    class="basic-nav-tabs"
    [class.basic-nav-tabs--framed]="framed"
    [style.margin]="margin"
>
    <header class="basic-nav-tabs__nav">
        <div class="basic-nav-tabs__nav-content">
            @if (showBackLink && backLinkTarget.length) {
                <div class="basic-nav-tabs__back-action">
                    <button
                        type="button"
                        mat-icon-button
                        color="accent"
                        [attr.aria-label]="backLinkLabel | translate"
                        [matTooltip]="backLinkLabel | translate"
                        (click)="navigateBack()"
                        class="edit-menu-btn"
                        data-cy="save-data-explorer-go-back-to-overview"
                    >
                        <mat-icon aria-hidden="true">arrow_back</mat-icon>
                    </button>
                </div>
            }
            <nav
                mat-tab-nav-bar
                [mat-stretch-tabs]="true"
                color="accent"
                [tabPanel]="tabPanel"
                class="basic-nav-tabs__tabs"
            >
                @for (item of spNavigationItems; track item.itemId) {
                    <a
                        mat-tab-link
                        [routerLink]="item.itemLink"
                        [relativeTo]="null"
                        [active]="activeLink === item.itemId"
                        [attr.data-cy]="'tab-' + item.itemTitle"
                    >
                        <span>{{ item.itemTitle | translate }}</span>
                    </a>
                }
            </nav>
        </div>
    </header>

    <mat-tab-nav-panel
        #tabPanel
        class="basic-nav-tabs__content"
        [class.basic-nav-tabs__content--padded]="padding === undefined"
        [style.padding]="padding"
    >
        <ng-content></ng-content>
    </mat-tab-nav-panel>
</div>
