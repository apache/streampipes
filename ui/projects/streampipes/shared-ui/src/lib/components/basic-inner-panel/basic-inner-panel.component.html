<div
    fxLayout="column"
    fxFlex="100"
    class="panel-outer"
    [class.panel-collapsed]="collapsible && collapsed"
    [ngStyle]="{ margin: outerMargin }"
>
    @if (!hideToolbar) {
        <header
            class="general-panel-header"
            [class.bg-highlight]="headerBackground"
            [class.bg-no-highlight]="!headerBackground"
            [style.height]="headerHeight"
            fxLayout="row"
            fxLayoutAlign="start center"
        >
            <div
                class="panel-header-content"
                fxLayout="row"
                fxLayoutAlign="start center"
                fxFlex="100"
            >
                @if (showTitle) {
                    <sp-basic-header-title-component
                        [title]="panelTitle"
                        [level]="3"
                        [margin]="'0'"
                        class="content-box-title"
                    ></sp-basic-header-title-component>
                }
                <ng-content select="[header]"></ng-content>
                <div fxFlex></div>
                @if (collapsible) {
                    <button
                        type="button"
                        class="collapse-btn"
                        [attr.aria-controls]="contentId"
                        [attr.aria-expanded]="!collapsed"
                        [attr.aria-label]="collapseButtonAriaLabel | translate"
                        (click)="toggleCollapse(); $event.stopPropagation()"
                    >
                        <mat-icon
                            class="chevron-icon"
                            [class.collapsed]="collapsed"
                        >
                            expand_less
                        </mat-icon>
                    </button>
                }
            </div>
        </header>
    }

    <div
        [id]="contentId"
        class="general-panel-wrapper"
        [attr.aria-hidden]="collapsible && collapsed"
        [attr.inert]="collapsible && collapsed ? '' : null"
        [@collapseExpand]="
            collapsible ? (collapsed ? 'collapsed' : 'expanded') : 'expanded'
        "
    >
        <div class="general-panel" [ngStyle]="{ padding: innerPadding }">
            <ng-content></ng-content>
        </div>
    </div>
</div>
