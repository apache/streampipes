<div class="filter-section flex-row items-center flex-100">
    <div class="filter-half flex-row items-center gap-sm">
        <div class="filter-header flex-row items-center flex-100">
            @if (selectedItems.length !== allItems.length) {
                <div
                    class="active-filters mr-5 flex-row justify-center items-center"
                >
                    <i class="material-icons fs-icon">filter_alt</i>
                </div>
            }
            <span>{{ title | translate }}</span>
            <div class="mr-10 flex-row justify-end items-center gap-2xs flex-1">
                <button
                    mat-button
                    mat-flat-button
                    color="accent"
                    class="small-button btn-margin"
                    (click)="selectAllEmitter.emit()"
                >
                    {{ 'All' | translate }}
                </button>
                <button
                    mat-button
                    mat-flat-button
                    class="small-button mat-basic btn-margin"
                    [attr.data-cy]="'filters-deselect-' + title"
                    (click)="deselectAllEmitter.emit()"
                >
                    {{ 'None' | translate }}
                </button>
            </div>
        </div>
    </div>
    <div
        class="filter-half filter-selection flex-col justify-end items-center"
        (click)="$event.stopPropagation()"
    >
        <ng-content> </ng-content>
    </div>
</div>
