<nav
    class="page-nav-tabs"
    [attr.aria-label]="ariaLabel | translate"
    data-cy="page-nav-tabs"
>
    <div
        class="page-nav-tabs__inner"
        [class.page-nav-tabs__inner--stretched]="stretchTabs"
    >
        @for (item of spNavigationItems; track item.itemId) {
            <a
                class="page-nav-tabs__item"
                [class.page-nav-tabs__item--active]="activeLink === item.itemId"
                [routerLink]="item.itemLink"
                [relativeTo]="null"
                [attr.aria-current]="activeLink === item.itemId ? 'page' : null"
                [attr.data-cy]="'tab-' + item.itemTitle"
            >
                @if (item.itemIcon) {
                    <mat-icon aria-hidden="true">{{ item.itemIcon }}</mat-icon>
                }
                <span>{{ item.itemTitle | translate }}</span>
            </a>
        }
    </div>
</nav>
