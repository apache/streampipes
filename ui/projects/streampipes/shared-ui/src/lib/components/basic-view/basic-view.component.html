<div
    fxLayout="column"
    class="basic-view"
    [class.basic-view--framed]="framed"
    [style.margin]="margin"
>
    @if (!hideNavbar) {
        <header class="basic-view__nav">
            <div class="basic-view__nav-content">
                @if (showBackLink && backLinkTarget?.length) {
                    <div class="basic-view__back-action">
                        <button
                            type="button"
                            mat-icon-button
                            color="accent"
                            [attr.aria-label]="backLinkLabel | translate"
                            [matTooltip]="backLinkLabel | translate"
                            (click)="navigateBack()"
                            class="edit-menu-btn"
                            data-cy="save-data-explorer-go-back-to-overview"
                        >
                            <mat-icon aria-hidden="true">arrow_back</mat-icon>
                        </button>
                    </div>
                }
                <div class="basic-view__actions">
                    <ng-content select="[nav]"></ng-content>
                </div>
            </div>
        </header>
    }

    <div
        class="basic-view__content"
        [class.basic-view__content--padded]="padding"
    >
        <ng-content></ng-content>
    </div>
</div>
