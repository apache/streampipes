<header
    class="page-header"
    [class.page-header--with-back]="backLinkTarget?.length"
>
    @if (backLinkTarget?.length) {
        <div class="page-header__navigation">
            <button
                type="button"
                mat-icon-button
                color="accent"
                [attr.aria-label]="backLinkLabel | translate"
                [matTooltip]="backLinkLabel | translate"
                (click)="navigateBack()"
            >
                <mat-icon aria-hidden="true">arrow_back</mat-icon>
            </button>
        </div>
    }
    <div
        class="page-header__identity"
        [style.--page-header-icon-color]="iconColor"
    >
        @if (icon) {
            <div class="page-header__icon" aria-hidden="true">
                <mat-icon>{{ icon }}</mat-icon>
            </div>
        }
        <div class="page-header__copy">
            <h1 class="page-header__title">{{ title }}</h1>
            @if (description) {
                <p class="page-header__description">{{ description }}</p>
            }
        </div>
    </div>

    <div class="page-header__actions">
        <ng-content select="[pageActions]"></ng-content>
    </div>
</header>
