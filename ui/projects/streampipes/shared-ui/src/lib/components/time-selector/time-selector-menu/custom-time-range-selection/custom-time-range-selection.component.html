<div class="w-100 flex-col flex-100">
    <div class="mt-10 flex-col flex-100">
        <mat-card style="width: 100%">
            <mat-calendar
                [(selected)]="currentDateRange"
                (selectedChange)="onDateChange($event)"
            >
            </mat-calendar>
        </mat-card>

        @if (enableTimePicker) {
            <div class="mt-10 mr-5 flex-col">
                <div class="flex-row gap-sm">
                    <div class="date-label">
                        <span
                            class="time-selector"
                            data-cy="time-selector-start-date"
                            >{{ currentStartDate }}</span
                        >
                    </div>
                    <div class="flex-1">
                        <input
                            matNativeControl
                            data-cy="time-selector-start-time"
                            class="w-100 time-selector"
                            type="time"
                            step="1"
                            [(ngModel)]="currentStartTime"
                            (ngModelChange)="
                                updateDateTime(currentDateRange.start, $event)
                            "
                        />
                    </div>
                </div>
                <div class="mt-10 flex-row gap-sm">
                    <div class="date-label">
                        <span
                            class="time-selector"
                            data-cy="time-selector-end-date"
                            >{{ currentEndDate }}</span
                        >
                    </div>
                    <div class="flex-1">
                        <input
                            matNativeControl
                            data-cy="time-selector-end-time"
                            class="w-100 time-selector"
                            type="time"
                            step="1"
                            [(ngModel)]="currentEndTime"
                            (ngModelChange)="
                                updateDateTime(currentDateRange.end, $event)
                            "
                        />
                    </div>
                </div>
            </div>
        }
    </div>
    @if (!enableTimePicker) {
        <div class="mt-10 date-preview flex-row">
            {{ dateRangeString }}
        </div>
    }
    @if (maxDateRangeError) {
        <div class="mt-5 max-date-range-error flex-row">
            {{
                labels.maxDayRangeErrorLabel.replace(
                    '${this.maxDayRange}',
                    maxDayRange.toString()
                )
            }}
        </div>
    }
    <div class="mt-10 flex-row justify-end items-center">
        <ng-content> </ng-content>
        @if (enableTimePicker) {
            <button
                mat-flat-button
                color="accent"
                data-cy="apply-custom-time"
                (click)="saveSelection()"
                [disabled]="!dateSelectionComplete"
            >
                {{ 'Apply' | translate }}
            </button>
        }
    </div>
</div>
