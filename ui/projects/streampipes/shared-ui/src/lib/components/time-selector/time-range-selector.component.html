<div
    fxLayout="row"
    class="time-range-selector"
    [class.time-range-selector--emphasized]="appearance === 'emphasized'"
>
    @if (showTimeSelector) {
        <div
            fxFlex
            fxLayoutAlign="center center"
            class="time-range-selector__navigation"
        >
            <button
                mat-icon-button
                color="accent"
                class="time-range-selector__step"
                [attr.aria-label]="'Previous' | translate"
                [matTooltip]="'Previous' | translate"
                (click)="applyPreviousInterval()"
            >
                <mat-icon aria-hidden="true">navigate_before</mat-icon>
            </button>
            <button
                mat-button
                color="accent"
                [matMenuTriggerFor]="menu"
                #menuTrigger="matMenuTrigger"
                [matTooltip]="labels.timeRangeSelectorTooltip"
                class="time-range-selector__selection"
                data-cy="time-selector-menu"
                (menuClosed)="menuTrigger.closeMenu()"
            >
                @if (appearance === 'emphasized') {
                    <span class="time-range-selector__selection-content">
                        <mat-icon
                            class="time-range-selector__calendar"
                            aria-hidden="true"
                            >calendar_today</mat-icon
                        >
                        <span class="time-range-selector__selection-copy">
                            @if (selectionLabel) {
                                <span class="time-range-selector__label">{{
                                    selectionLabel
                                }}</span>
                            }
                            @if (timeStringMode === 'advanced') {
                                <span class="formatted-datetime">
                                    <span class="formatted-date">{{
                                        timeString.startDate
                                    }}</span>
                                    @if (enableTimePicker) {
                                        <span>
                                            &nbsp;<span
                                                class="formatted-time"
                                                >{{
                                                    timeString.startTime
                                                }}</span
                                            >
                                        </span>
                                    }
                                    @if (
                                        enableTimePicker || !timeString.sameDay
                                    ) {
                                        <span>
                                            <span class="formatted-date"
                                                >&nbsp;-&nbsp;</span
                                            >
                                            <span class="formatted-date">{{
                                                timeString.endDate
                                            }}</span>
                                            @if (enableTimePicker) {
                                                <span>
                                                    &nbsp;<span
                                                        class="formatted-time"
                                                        >{{
                                                            timeString.endTime
                                                        }}</span
                                                    >
                                                </span>
                                            }
                                        </span>
                                    }
                                </span>
                            }
                            @if (timeStringMode === 'simple') {
                                <span class="formatted-datetime">
                                    {{ simpleTimeString }}
                                </span>
                            }
                        </span>
                        <mat-icon
                            class="time-range-selector__expand"
                            aria-hidden="true"
                            >arrow_drop_down</mat-icon
                        >
                    </span>
                } @else {
                    @if (timeStringMode === 'advanced') {
                        <div class="formatted-datetime">
                            <span class="formatted-date">{{
                                timeString.startDate
                            }}</span>
                            @if (enableTimePicker) {
                                <span>
                                    &nbsp;<span class="formatted-time">{{
                                        timeString.startTime
                                    }}</span>
                                </span>
                            }
                            @if (enableTimePicker || !timeString.sameDay) {
                                <div>
                                    <span class="formatted-date"
                                        >&nbsp;-&nbsp;</span
                                    >
                                    <span class="formatted-date">{{
                                        timeString.endDate
                                    }}</span>
                                    @if (enableTimePicker) {
                                        <span>
                                            &nbsp;<span
                                                class="formatted-time"
                                                >{{ timeString.endTime }}</span
                                            >
                                        </span>
                                    }
                                </div>
                            }
                        </div>
                    }
                    @if (timeStringMode === 'simple') {
                        <div class="formatted-datetime">
                            {{ simpleTimeString }}
                        </div>
                    }
                }
            </button>
            <button
                mat-icon-button
                color="accent"
                class="time-range-selector__step"
                [attr.aria-label]="'Next' | translate"
                [matTooltip]="'Next' | translate"
                (click)="applyNextInterval()"
            >
                <mat-icon aria-hidden="true">navigate_next</mat-icon>
            </button>
            <mat-menu #menu="matMenu" fxFlex="100" class="large-menu">
                <sp-time-selector-menu
                    #timeSelectorMenu
                    [timeSettings]="timeSettings"
                    [labels]="labels"
                    (timeSettingsEmitter)="applyCurrentDateRange($event)"
                    [quickSelections]="quickSelections"
                    [enableTimePicker]="enableTimePicker"
                    [maxDayRange]="maxDayRange"
                    class="w-100"
                >
                </sp-time-selector-menu>
            </mat-menu>
        </div>
    }
    <div fxLayoutAlign="end center">
        <button
            mat-icon-button
            class="time-range-selector__refresh"
            [matTooltip]="'Refresh' | translate"
            [attr.aria-label]="'Refresh' | translate"
            color="accent"
            (click)="updateTimeSettingsAndReload()"
        >
            <mat-icon aria-hidden="true">refresh</mat-icon>
        </button>
    </div>
    <div fxLayoutAlign="end center">
        @if (liveSettings && showIntervalSettings) {
            <sp-data-explorer-refresh-interval-settings-component
                #refreshIntervalSettings
                [liveSettings]="liveSettings"
                (intervalSettingsChangedEmitter)="
                    intervalSettingsChangedEmitter.emit($event)
                "
                [availableOptions]="availableOptions"
                [appearance]="appearance"
            >
            </sp-data-explorer-refresh-interval-settings-component>
        }
    </div>
</div>
