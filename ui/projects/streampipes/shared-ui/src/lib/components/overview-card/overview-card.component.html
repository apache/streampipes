<article
    class="card"
    [style.--card-accent]="accentColor()"
    [attr.aria-label]="title()"
>
    <header
        class="card-header"
        [class.card-header--compact]="!reserveDescription()"
    >
        <div class="card-select">
            <ng-content select="[cardSelect]" />
        </div>
        <div class="card-identity">
            <div
                class="card-title"
                role="heading"
                aria-level="2"
                [matTooltip]="title()"
            >
                @if (titleClickable()) {
                    <button
                        type="button"
                        class="card-title-link"
                        (click)="titleClick.emit()"
                    >
                        {{ title() }}
                    </button>
                } @else {
                    {{ title() }}
                }
            </div>
            @if (description()) {
                <p class="card-description" [matTooltip]="description()">
                    {{ description() }}
                </p>
            }
        </div>
        <div class="card-icon">
            <ng-content select="[cardIcon]" />
        </div>
    </header>
    <div class="card-body">
        <ng-content />
    </div>
    <div class="card-context">
        <ng-content select="[cardAssetContext]" />
    </div>
    <footer class="card-footer">
        <div class="card-footer-start">
            <ng-content select="[cardFooter]" />
        </div>
        <div class="card-footer-end">
            <ng-content select="[cardFooterActions]" />
        </div>
    </footer>
</article>
