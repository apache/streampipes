@if (configReady && showAcknowledgment) {
    <sp-auth-box [linkSettings]="loginSettings.linkSettings">
        <div class="page flex-col">
            <div class="flex-col justify-center items-start flex-none">
                <h1>{{ loginSettings.termsAcknowledgmentTitle }}</h1>
            </div>

            <div class="terms-box flex-none" [innerHTML]="sanitizedText"></div>
            <mat-divider></mat-divider>
            <div class="mt-10 flex-row gap-sm flex-none">
                <button mat-flat-button (click)="onTermsAcknowledged()">
                    {{ 'Accept' | translate }}
                </button>
                <button
                    mat-flat-button
                    class="mat-basic"
                    (click)="onTermsRejected()"
                >
                    {{ 'Reject' | translate }}
                </button>
            </div>
        </div>
    </sp-auth-box>
}
