<sp-dataset-details-layout
    [dataset]="dataset"
    [datasetNotFound]="datasetNotFound"
    [tabs]="tabs"
    activeLink="metrics"
>
    <button
        pageActions
        type="button"
        mat-icon-button
        color="accent"
        [disabled]="loadingMetrics"
        [attr.aria-label]="'Refresh' | translate"
        [matTooltip]="'Refresh' | translate"
        (click)="triggerUpdate()"
    >
        <mat-icon aria-hidden="true">{{
            loadingMetrics ? 'hourglass_top' : 'refresh'
        }}</mat-icon>
    </button>

    @if (dataset) {
        <div
            fxFlex="100"
            fxLayout="column"
            fxLayoutGap="1rem"
            data-cy="dataset-details-metrics"
        >
            @if (loadingMetrics) {
                <div
                    class="loading-state"
                    fxLayout="row"
                    fxLayoutAlign="center center"
                >
                    <sp-spinner
                        [diameter]="32"
                        [text]="'Loading' | translate"
                    ></sp-spinner>
                </div>
            }

            <sp-simple-metrics
                [elementName]="dataset.measureName"
                [lastPublishedLabel]="'Last event' | translate"
                [statusValueLabel]="'Total events' | translate"
                [lastTimestamp]="lastEventTimestamp"
                [statusValue]="totalEventCount"
            >
            </sp-simple-metrics>

            <sp-daily-event-counts-chart
                [dailyEventCounts]="dailyEventCounts"
            ></sp-daily-event-counts-chart>
        </div>
    }
</sp-dataset-details-layout>
