<div fxLayout="column" class="page-container page-container-no-bg">
    @if (currentUser) {
        <sp-welcome [user]="currentUser"></sp-welcome>
    }
    @if (showStatus) {
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
            @for (box of statusBoxes; track box) {
                <sp-status
                    [fxFlex]="100 / statusBoxes.length"
                    [statusBox]="box"
                    [assetLinkType]="assetLinkTypes[box.assetLinkTypeId]"
                    [currentUser]="currentUser"
                ></sp-status>
            }
        </div>
    }
    <div fxFlex class="assets-wrapper">
        @if (contentLoaded) {
            <sp-split-section
                fxFlex
                [level]="2"
                [title]="'Assets' | translate"
                class="asset-section"
            >
                <div section-actions>
                    <mat-button-toggle-group
                        name="Asset view"
                        aria-label="Asset view mode"
                        [(ngModel)]="selectedView"
                    >
                        <mat-button-toggle
                            value="map"
                            [disabled]="
                                !locationConfig ||
                                !locationConfig.locationEnabled
                            "
                            >{{ 'Map' | translate }}
                        </mat-button-toggle>
                        <mat-button-toggle value="table">{{
                            'Table' | translate
                        }}</mat-button-toggle>
                    </mat-button-toggle-group>
                </div>
                <div fxFlexFill fxLayout="column" class="assets-content">
                    @if (selectedView === 'map') {
                        <sp-home-asset-map
                            class="h-100 map"
                            [assetLinkTypes]="assetLinkTypes"
                            [sites]="sites"
                            [locationConfig]="locationConfig"
                            [assets]="assets"
                        ></sp-home-asset-map>
                    } @else {
                        <sp-home-asset-table
                            [assetLinkTypes]="assetLinkTypes"
                            [sites]="sites"
                            [locationConfig]="locationConfig"
                            [assets]="assets"
                        >
                        </sp-home-asset-table>
                    }
                </div>
            </sp-split-section>
        }
    </div>
</div>
