<sp-basic-view [hideNavbar]="true" [padding]="true">
    @let pageHeaderAssetLinkType = pageHeaderAssetLinkType$ | async;
    <sp-page-header
        [title]="'Charts' | translate"
        [icon]="pageHeaderAssetLinkType?.linkIcon ?? 'query_stats'"
        [iconColor]="
            pageHeaderAssetLinkType?.linkColor ?? 'var(--color-primary)'
        "
    >
        @if (hasDataExplorerWritePrivileges) {
            <button
                pageActions
                type="button"
                mat-flat-button
                color="accent"
                data-cy="open-new-chart"
                (click)="createNewChart()"
            >
                <i class="material-icons" aria-hidden="true">add</i>
                <span>{{ 'New chart' | translate }}</span>
            </button>
        }
    </sp-page-header>
    <sp-data-explorer-overview-table
        [hasDataExplorerWritePrivileges]="hasDataExplorerWritePrivileges"
    ></sp-data-explorer-overview-table>
</sp-basic-view>
