@if (selectedResultFields.length > 0) {
    <sp-chart-settings-section
        [heading]="'Result Labels' | translate"
        [description]="customLabels || ('Use field names' | translate)"
        data-cy="chart-section-labels"
    >
        <div class="flex-col gap-sm">
            @for (field of selectedResultFields; track field.fullDbName) {
                <sp-form-field [level]="3" [label]="field.fullDbName">
                    <mat-form-field
                        appearance="outline"
                        color="accent"
                        class="w-100 form-field-small"
                    >
                        <input
                            matInput
                            [attr.aria-label]="field.fullDbName"
                            [attr.data-cy]="
                                'data-explorer-result-label-input-' +
                                field.fullDbName
                            "
                            [ngModel]="getLabel(field)"
                            (ngModelChange)="updateLabel(field, $event)"
                            [placeholder]="field.fullDbName"
                        />
                    </mat-form-field>
                </sp-form-field>
            }
        </div>
    </sp-chart-settings-section>
}
