@let names = selectedNames;
<sp-chart-settings-section
    [heading]="'Group by' | translate"
    [description]="
        names.length
            ? ('{{count}} selected' | translate: { count: names.length }) +
              ' · ' +
              names.join(', ')
            : ('No grouping' | translate)
    "
    data-cy="chart-section-group"
>
    <div class="flex-row flex-wrap items-center gap-sm">
        <button
            mat-button
            mat-flat-button
            color="accent"
            class="small-button"
            (click)="selectAllFields()"
        >
            {{ 'Select all' | translate }}
        </button>
        <button
            mat-button
            mat-flat-button
            class="small-button mat-basic"
            (click)="deselectAllFields()"
        >
            {{ 'Deselect all' | translate }}
        </button>
    </div>
    <div class="field-scroll-panel flex-col">
        @for (
            groupByField of sourceConfig.queryConfig.groupBy;
            track groupByField
        ) {
            <div class="flex-col">
                <mat-checkbox
                    [(ngModel)]="groupByField.selected"
                    [attr.data-cy]="
                        'data-explorer-group-by-' + groupByField.runtimeName
                    "
                    (change)="triggerConfigurationUpdate()"
                    color="accent"
                >
                    {{ groupByField.runtimeName }}
                </mat-checkbox>
            </div>
        }
    </div>
</sp-chart-settings-section>
