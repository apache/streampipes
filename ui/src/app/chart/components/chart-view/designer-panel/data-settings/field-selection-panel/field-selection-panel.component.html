<sp-split-section spRangeSelection [level]="3" [title]="'Fields' | translate">
    <div section-actions fxLayoutAlign="start center" fxFlex="100">
        <button
            mat-button
            mat-flat-button
            color="accent"
            class="small-button btn-margin"
            data-cy="data-explorer-data-set-field-select-all"
            (click)="selectAllFields()"
        >
            {{ 'Select all' | translate }}
        </button>
        <button
            mat-button
            mat-flat-button
            class="small-button mat-basic btn-margin"
            (click)="deselectAllFields()"
        >
            {{ 'Deselect all' | translate }}
        </button>
        <span fxFlex></span>
        @if (!expandFields) {
            <button
                mat-icon-button
                class="pull-btn-right"
                [matTooltip]="'Expand More' | translate"
                (click)="toggleExpandFields()"
            >
                <mat-icon>expand_more</mat-icon>
            </button>
        }
        @if (expandFields) {
            <button
                mat-icon-button
                class="pull-btn-right"
                [matTooltip]="'Expand Less' | translate"
                (click)="toggleExpandFields()"
            >
                <mat-icon>expand_less</mat-icon>
            </button>
        }
    </div>
    <mat-form-field
        appearance="outline"
        subscriptSizing="dynamic"
        class="w-100 mb-sm"
    >
        <mat-icon matPrefix>search</mat-icon>
        <input
            matInput
            [(ngModel)]="fieldSearch"
            [placeholder]="'Search fields' | translate"
            [attr.aria-label]="'Search fields' | translate"
            data-cy="data-explorer-field-search"
        />
        @if (fieldSearch) {
            <button
                mat-icon-button
                matSuffix
                type="button"
                [attr.aria-label]="'Clear search' | translate"
                (click)="fieldSearch = ''"
            >
                <mat-icon>close</mat-icon>
            </button>
        }
    </mat-form-field>
    <div
        fxLayout="column"
        [class.field-scroll-panel]="!expandFields"
        data-cy="data-explorer-field-selection-panel"
    >
        @for (field of filteredFields; track field) {
            <div fxLayout="column">
                <sp-field-selection
                    [field]="field"
                    [sourceConfig]="sourceConfig"
                >
                </sp-field-selection>
            </div>
        } @empty {
            <p role="status">{{ 'No matching fields' | translate }}</p>
        }
    </div>
</sp-split-section>
