@let names = selectedNames;
<sp-chart-settings-section
    [heading]="'Fields' | translate"
    [description]="
        names.length
            ? ('{{count}} selected' | translate: { count: names.length }) +
              ' · ' +
              names.join(', ')
            : ('No fields selected' | translate)
    "
    data-cy="chart-section-fields"
>
    @let matches = filteredFields;
    <mat-form-field
        appearance="outline"
        subscriptSizing="dynamic"
        class="w-100"
    >
        <mat-icon matPrefix>search</mat-icon>
        <input
            matInput
            [(ngModel)]="fieldSearch"
            [placeholder]="'Search fields' | translate"
            [attr.aria-label]="'Search fields' | translate"
            data-cy="data-explorer-field-search"
        />
        @if (fieldSearch) {
            <button
                mat-icon-button
                matSuffix
                type="button"
                [attr.aria-label]="'Clear search' | translate"
                (click)="fieldSearch = ''"
            >
                <mat-icon>close</mat-icon>
            </button>
        }
    </mat-form-field>
    <div class="flex-row flex-wrap items-center gap-sm">
        <button
            mat-button
            mat-flat-button
            color="accent"
            class="small-button"
            data-cy="data-explorer-data-set-field-select-all"
            [disabled]="!matches.length"
            (click)="selectAllFields()"
        >
            {{
                fieldSearch.trim()
                    ? ('Select matches' | translate)
                    : ('Select all' | translate)
            }}
        </button>
        <button
            mat-button
            mat-flat-button
            class="small-button mat-basic"
            [disabled]="!matches.length"
            data-cy="chart-deselect-fields"
            (click)="deselectAllFields()"
        >
            {{
                fieldSearch.trim()
                    ? ('Deselect matches' | translate)
                    : ('Deselect all' | translate)
            }}
        </button>
    </div>
    <div
        class="field-list flex-col"
        role="group"
        [attr.aria-label]="'Fields' | translate"
        data-cy="data-explorer-field-selection-panel"
    >
        @for (field of matches; track field) {
            <sp-field-selection [field]="field" [sourceConfig]="sourceConfig" />
        } @empty {
            <p class="m-0" role="status">
                {{ 'No matching fields' | translate }}
            </p>
        }
    </div>
</sp-chart-settings-section>
