<div class="form-field-small p-lg flex-col flex-100">
    <sp-form-field [level]="2" [label]="'Chart Type' | translate">
        <mat-form-field
            appearance="outline"
            color="accent"
            subscriptSizing="dynamic"
            class="w-100"
        >
            <mat-select
                [aria-label]="'Chart Type' | translate"
                [(value)]="currentlyConfiguredWidget.widgetType"
                (selectionChange)="triggerWidgetTypeChange($event)"
                data-cy="data-explorer-select-visualization-type"
            >
                <mat-select-trigger>{{
                    activeWidgetType.label
                }}</mat-select-trigger>
                @for (widget of availableWidgets; track widget) {
                    <mat-option
                        [value]="widget.id"
                        [attr.data-cy]="'select-widget-' + widget.id"
                    >
                        <mat-icon>{{ widget.icon }}</mat-icon>
                        <span class="font-emphasized text-md">{{
                            widget.label
                        }}</span>
                        <span class="widget-description">{{
                            widget.description
                        }}</span>
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>
    </sp-form-field>

    @if (activeWidgetType) {
        <div>
            <ng-container
                *ngComponentOutlet="
                    activeWidgetType.widgetConfigurationComponent;
                    inputs: {
                        currentlyConfiguredWidget: currentlyConfiguredWidget,
                    }
                "
            />
        </div>
        <sp-chart-appearance-settings
            [appearanceConfig]="currentlyConfiguredWidget.baseAppearanceConfig"
        />
        @if (activeWidgetType.widgetAppearanceConfigurationComponent) {
            <ng-container
                *ngComponentOutlet="
                    activeWidgetType.widgetAppearanceConfigurationComponent;
                    inputs: {
                        appearanceConfig:
                            currentlyConfiguredWidget.baseAppearanceConfig,
                    }
                "
            />
        }
    }
</div>
