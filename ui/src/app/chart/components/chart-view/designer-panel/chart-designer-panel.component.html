<div class="flex-100 flex-row">
    @if (currentlyConfiguredWidget) {
        <div class="designer-panel-content flex-col flex-100">
            <div class="no-overflow flex-col flex-100">
                <mat-tab-group
                    [selectedIndex]="selectedIndex"
                    (selectedIndexChange)="selectOptionsPanel($event)"
                    color="accent"
                    class="small-tab-headers mat-tab-fill-height flex-fill"
                >
                    <mat-tab
                        data-cy="designer-panel-data-config"
                        [label]="'Data' | translate"
                    >
                        <div class="scroll-tab-content">
                            <sp-chart-data-settings
                                #dataSettingsPanel
                                [(dataLakeMeasure)]="dataLakeMeasure"
                                [dataConfig]="dataConfig"
                                [currentlyConfiguredWidget]="
                                    currentlyConfiguredWidget
                                "
                                [newWidgetMode]="newWidgetMode"
                                [widgetId]="currentlyConfiguredWidget.elementId"
                                (createWidgetEmitter)="createNewWidget()"
                            >
                            </sp-chart-data-settings>
                        </div>
                    </mat-tab>
                    <mat-tab
                        data-cy="designer-panel-visualization-config"
                        [label]="'Visualization' | translate"
                        [disabled]="
                            !currentlyConfiguredWidget.dataConfig
                                .sourceConfigs ||
                            currentlyConfiguredWidget.dataConfig.sourceConfigs
                                .length === 0
                        "
                    >
                        <div class="scroll-tab-content flex-row">
                            @if (currentlyConfiguredWidget.widgetType) {
                                <sp-chart-visualisation-settings
                                    class="flex-col flex-100"
                                    [currentlyConfiguredWidget]="
                                        currentlyConfiguredWidget
                                    "
                                >
                                </sp-chart-visualisation-settings>
                            }
                        </div>
                    </mat-tab>
                    <mat-tab
                        data-cy="designer-panel-appearance-config"
                        [label]="'Appearance' | translate"
                    >
                        <div class="scroll-tab-content flex-row">
                            <sp-chart-appearance-settings
                                class="flex-col flex-100"
                                [currentlyConfiguredWidget]="
                                    currentlyConfiguredWidget
                                "
                            >
                            </sp-chart-appearance-settings>
                        </div>
                    </mat-tab>
                </mat-tab-group>
            </div>
            @if (newWidgetMode) {
                <div
                    class="new-widget-section flex-row justify-end items-center"
                >
                    @if (newWidgetMode && selectedIndex === 0) {
                        <button
                            mat-button
                            mat-flat-button
                            color="accent"
                            data-cy="data-explorer-select-data-set-next-btn"
                            [disabled]="
                                selectedIndex === 0 &&
                                (!currentlyConfiguredWidget.dataConfig
                                    .sourceConfigs ||
                                    currentlyConfiguredWidget.dataConfig
                                        .sourceConfigs.length === 0 ||
                                    currentlyConfiguredWidget.dataConfig
                                        .sourceConfigs[0].measureName === '')
                            "
                            (click)="selectedIndex = 1"
                        >
                            {{ 'Next' | translate }}
                        </button>
                    }
                    @if (newWidgetMode && selectedIndex === 1) {
                        <button
                            mat-button
                            mat-flat-button
                            class="mat-basic mr-10"
                            (click)="selectedIndex = 0"
                            style="margin-right: 10px"
                        >
                            {{ 'Back' | translate }}
                        </button>
                    }
                    @if (newWidgetMode && selectedIndex === 1) {
                        <button
                            mat-button
                            mat-flat-button
                            color="accent"
                            data-cy="data-explorer-select-data-set-create-btn"
                            (click)="createNewWidget()"
                        >
                            {{ 'Create' | translate }}
                        </button>
                    }
                </div>
            }
        </div>
    }
</div>
