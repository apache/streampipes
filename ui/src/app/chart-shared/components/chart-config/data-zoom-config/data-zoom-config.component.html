<div class="flex-col gap-sm">
    <mat-checkbox
        [(ngModel)]="appearanceConfig.dataZoom.show"
        (ngModelChange)="configChangedEmitter.emit()"
    >
        {{ 'Data Zoom' | translate }}
    </mat-checkbox>
    <sp-form-field [level]="3" [label]="'Type' | translate">
        <mat-form-field
            appearance="outline"
            color="accent"
            subscriptSizing="dynamic"
        >
            <mat-select
                [aria-label]="'Type' | translate"
                (ngModelChange)="configChangedEmitter.emit()"
                [(ngModel)]="appearanceConfig.dataZoom.type"
                [disabled]="!appearanceConfig.dataZoom.show"
            >
                <mat-option value="inside">{{
                    'Wheel' | translate
                }}</mat-option>
                <mat-option value="slider">{{
                    'Slider' | translate
                }}</mat-option>
            </mat-select>
        </mat-form-field>
    </sp-form-field>
</div>
