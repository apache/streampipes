<sp-chart-settings-section
    [heading]="'Series' | translate"
    [description]="
        ('Selected fields' | translate) + ' · ' + selectedProperties.length
    "
    [initiallyOpen]="true"
>
    <sp-field-selection-actions (selectionChange)="selectFields($event)" />
    @for (field of availableProperties; track field) {
        <div class="field-selection-box flex-col">
            <sp-time-series-item-config
                [selectedProperties]="selectedProperties"
                [currentlyConfiguredWidget]="currentlyConfiguredWidget"
                [field]="field"
                (viewRefreshEmitter)="triggerViewRefresh()"
                (configChangeEmitter)="triggerSelectedProperties()"
            >
            </sp-time-series-item-config>
        </div>
    }
</sp-chart-settings-section>
