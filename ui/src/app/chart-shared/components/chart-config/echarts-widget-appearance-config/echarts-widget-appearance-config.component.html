<sp-chart-settings-section
    [heading]="'Legend & tooltip' | translate"
    [description]="
        (appearanceConfig.chartAppearance.showLegend
            ? ('Legend on' | translate)
            : ('Legend off' | translate)) +
        ' · ' +
        (appearanceConfig.chartAppearance.showTooltip
            ? ('Tooltip on' | translate)
            : ('Tooltip off' | translate))
    "
>
    <mat-checkbox
        [(ngModel)]="appearanceConfig.chartAppearance.showLegend"
        (change)="triggerViewUpdate()"
        >{{ 'Show legend' | translate }}
    </mat-checkbox>
    <mat-checkbox
        [(ngModel)]="appearanceConfig.chartAppearance.showTooltip"
        (change)="triggerViewUpdate()"
        >{{ 'Show tooltip' | translate }}
    </mat-checkbox></sp-chart-settings-section
>
<sp-chart-settings-section
    [heading]="'Chart interaction' | translate"
    [description]="
        appearanceConfig.chartAppearance.showToolbox
            ? ('Toolbox on' | translate)
            : ('Toolbox off' | translate)
    "
>
    <mat-checkbox
        [(ngModel)]="appearanceConfig.chartAppearance.showToolbox"
        (change)="triggerViewUpdate()"
        >{{ 'Show toolbox' | translate }} </mat-checkbox
    ><ng-content
/></sp-chart-settings-section>
<sp-number-format-config [appearanceConfig]="appearanceConfig" />
