<sp-chart-settings-section
    [heading]="title"
    [initiallyOpen]="initiallyOpen"
    [description]="
        ('Selected fields' | translate) +
        ' · ' +
        (selectedProperties?.length || 0)
    "
>
    <sp-field-selection-actions (selectionChange)="selectFields($event)" />
    <div class="field-scroll-panel flex-col">
        @for (field of availableProperties; track field) {
            <mat-checkbox
                color="accent"
                [checked]="isSelected(field)"
                (change)="toggleFieldSelection(field)"
            >
                <b>{{ field.runtimeName }}</b>
                {{
                    '(' +
                        (field.aggregation ? field.aggregation + ', ' : '') +
                        field.measure +
                        ')'
                }}
            </mat-checkbox>
        }
    </div>
</sp-chart-settings-section>
