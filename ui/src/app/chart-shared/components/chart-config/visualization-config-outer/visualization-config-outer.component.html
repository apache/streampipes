<div class="h-100 form-field-small flex-col flex-100">
    @if (!configurationValid) {
        <div class="flex-col items-start gap-sm">
            <p class="m-0">
                {{
                    requirement ||
                        ('Select at least one field for this chart.'
                            | translate)
                }}
            </p>
            @if (navigation) {
                <button
                    type="button"
                    mat-button
                    data-cy="chart-choose-fields"
                    (click)="navigation.chooseFields()"
                >
                    {{ 'Choose fields' | translate }}
                </button>
            }
        </div>
    }
    @if (configurationValid) {
        <div class="flex-100">
            <ng-content></ng-content>
        </div>
    }
</div>
