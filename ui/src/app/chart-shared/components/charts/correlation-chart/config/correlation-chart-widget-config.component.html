@let config = currentlyConfiguredWidget.visualizationConfig;
<sp-visualization-config-outer
    [requirement]="
        'Select at least one numeric field for this chart.' | translate
    "
    [configurationValid]="config.configurationValid"
>
    <sp-chart-settings-section
        [heading]="'X and Y axes' | translate"
        [description]="
            (config.firstField?.fullDbName || '—') +
            ' × ' +
            (config.secondField?.fullDbName || '—')
        "
        [initiallyOpen]="true"
    >
        <sp-form-field [level]="3" [label]="'X' | translate">
            <sp-select-single-property-config
                class="flex-1"
                [availableProperties]="fieldProvider.numericFields"
                [selectedProperty]="config.firstField"
                (changeSelectedProperty)="updateFirstField($event)"
            >
            </sp-select-single-property-config>
        </sp-form-field>
        <sp-form-field [level]="3" [label]="'X Label' | translate">
            <mat-form-field appearance="outline" color="accent">
                <input
                    matInput
                    type="text"
                    [(ngModel)]="config.labelX"
                    (ngModelChange)="triggerViewRefresh()"
                />
            </mat-form-field>
        </sp-form-field>
        <sp-form-field [level]="3" [label]="'Y' | translate">
            <sp-select-single-property-config
                class="flex-1"
                [availableProperties]="fieldProvider.numericFields"
                [selectedProperty]="config.secondField"
                (changeSelectedProperty)="updateSecondField($event)"
            >
            </sp-select-single-property-config>
        </sp-form-field>
        <sp-form-field [level]="3" [label]="'Y Label' | translate">
            <mat-form-field appearance="outline" color="accent">
                <input
                    matInput
                    type="text"
                    [(ngModel)]="config.labelY"
                    (ngModelChange)="triggerViewRefresh()"
                />
            </mat-form-field>
        </sp-form-field>
    </sp-chart-settings-section>
</sp-visualization-config-outer>
