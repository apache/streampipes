<sp-visualization-config-outer
    [configurationValid]="
        currentlyConfiguredWidget.visualizationConfig.configurationValid
    "
>
    <sp-select-properties-config
        [title]="'Fields' | translate"
        [availableProperties]="fieldProvider.allFields"
        [selectedProperties]="
            currentlyConfiguredWidget.visualizationConfig.selectedFields
        "
        (changeSelectedProperties)="updateSelectedFields($event)"
    >
    </sp-select-properties-config>

    <sp-field-order-config
        [sectionTitle]="'Field Order'"
        [selectedFields]="
            currentlyConfiguredWidget.visualizationConfig.selectedFields
        "
        (selectedFieldsChange)="setSelectedFieldOrder($event)"
    >
    </sp-field-order-config>

    <sp-split-section [level]="3" [title]="'Content' | translate">
        <sp-form-field [level]="3" [label]="'Timestamp' | translate">
            <mat-checkbox
                data-cy="data-explorer-value-card-show-timestamp"
                [checked]="
                    currentlyConfiguredWidget.visualizationConfig.showTimestamp
                "
                (change)="
                    currentlyConfiguredWidget.visualizationConfig.showTimestamp =
                        $event.checked;
                    triggerViewRefresh()
                "
            >
                {{ 'Show latest time above card' | translate }}
            </mat-checkbox>
        </sp-form-field>

        <sp-form-field [level]="3" [label]="'Title' | translate">
            <mat-form-field fxFlex="100">
                <input
                    data-cy="data-explorer-value-card-title-input"
                    matInput
                    type="text"
                    [(ngModel)]="
                        currentlyConfiguredWidget.visualizationConfig.title
                    "
                    (ngModelChange)="triggerViewRefresh()"
                />
            </mat-form-field>
        </sp-form-field>

        <sp-form-field [level]="3" [label]="'Description' | translate">
            <mat-form-field fxFlex="100">
                <textarea
                    data-cy="data-explorer-value-card-description-input"
                    matInput
                    rows="3"
                    [(ngModel)]="
                        currentlyConfiguredWidget.visualizationConfig
                            .description
                    "
                    (ngModelChange)="triggerViewRefresh()"
                ></textarea>
            </mat-form-field>
        </sp-form-field>
    </sp-split-section>
</sp-visualization-config-outer>
