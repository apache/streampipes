@let config = currentlyConfiguredWidget.visualizationConfig;
<sp-visualization-config-outer [configurationValid]="config.configurationValid">
    <sp-select-properties-config
        [title]="'Displayed values' | translate"
        [availableProperties]="fieldProvider.allFields"
        [selectedProperties]="config.selectedFields"
        (changeSelectedProperties)="updateSelectedFields($event)"
    >
    </sp-select-properties-config>

    <sp-field-order-config
        [sectionTitle]="'Value order' | translate"
        [selectedFields]="config.selectedFields"
        (selectedFieldsChange)="setSelectedFieldOrder($event)"
    >
    </sp-field-order-config>

    <sp-chart-settings-section
        [heading]="'Title and timestamp' | translate"
        [description]="
            config.title ||
            (config.showTimestamp
                ? ('Timestamp' | translate)
                : ('No title' | translate))
        "
        data-cy="chart-section-caption"
    >
        <sp-form-field [level]="3" [label]="'Timestamp' | translate">
            <mat-checkbox
                data-cy="data-explorer-value-card-show-timestamp"
                [checked]="config.showTimestamp"
                (change)="
                    config.showTimestamp = $event.checked; triggerViewRefresh()
                "
            >
                {{ 'Show latest time above card' | translate }}
            </mat-checkbox>
        </sp-form-field>

        <sp-chart-caption-fields
            [caption]="config"
            chartKey="value-card"
            (captionChange)="triggerViewRefresh()"
        />
    </sp-chart-settings-section>
</sp-visualization-config-outer>
