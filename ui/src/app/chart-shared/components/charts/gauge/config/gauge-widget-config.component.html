@let config = currentlyConfiguredWidget.visualizationConfig;
<sp-visualization-config-outer
    [requirement]="
        'Select at least one numeric field for this chart.' | translate
    "
    [configurationValid]="config.configurationValid"
>
    <sp-chart-settings-section
        [heading]="'Gauge value' | translate"
        [description]="
            config.selectedProperty?.fullDbName ||
            ('No fields selected' | translate)
        "
        [initiallyOpen]="true"
    >
        <sp-select-single-property-config
            [availableProperties]="fieldProvider.numericFields"
            [selectedProperty]="config.selectedProperty"
            (changeSelectedProperty)="setSelectedProperty($event)"
        >
        </sp-select-single-property-config>
    </sp-chart-settings-section>
    @if (config.selectedProperty?.fieldCharacteristics.numeric) {
        <sp-chart-settings-section
            [heading]="'Dial range and scale' | translate"
            [description]="config.min + ' – ' + config.max"
        >
            <sp-form-field
                [level]="3"
                [label]="'Min' | translate"
                [description]="
                    'Lower bound of the gauge value range.' | translate
                "
            >
                <mat-form-field class="w-100">
                    <input
                        matInput
                        type="number"
                        [(ngModel)]="config.min"
                        (ngModelChange)="triggerViewRefresh()"
                    />
                </mat-form-field>
            </sp-form-field>
            <sp-form-field
                [level]="3"
                [label]="'Max' | translate"
                [description]="
                    'Upper bound of the gauge value range.' | translate
                "
            >
                <mat-form-field class="w-100">
                    <input
                        matInput
                        type="number"
                        [(ngModel)]="config.max"
                        (ngModelChange)="triggerViewRefresh()"
                    />
                </mat-form-field>
            </sp-form-field>
            <sp-form-field
                [level]="3"
                [label]="'Display Name' | translate"
                [description]="
                    'Label shown below the current gauge value.' | translate
                "
            >
                <mat-form-field class="w-100">
                    <input
                        matInput
                        type="text"
                        [ngModel]="getDisplayName()"
                        (ngModelChange)="onDisplayNameChange($event)"
                    />
                </mat-form-field>
            </sp-form-field>

            <sp-form-field
                [level]="3"
                [label]="'Start Angle' | translate"
                [description]="
                    'Angle where the gauge arc begins (in degrees).' | translate
                "
            >
                <mat-form-field class="w-100">
                    <input
                        matInput
                        type="number"
                        [(ngModel)]="config.startAngle"
                        (ngModelChange)="triggerViewRefresh()"
                    />
                </mat-form-field>
            </sp-form-field>

            <sp-form-field
                [level]="3"
                [label]="'End Angle' | translate"
                [description]="
                    'Angle where the gauge arc ends (in degrees).' | translate
                "
            >
                <mat-form-field class="w-100">
                    <input
                        matInput
                        type="number"
                        [(ngModel)]="config.endAngle"
                        (ngModelChange)="triggerViewRefresh()"
                    />
                </mat-form-field>
            </sp-form-field>

            <sp-form-field
                [level]="3"
                [label]="'Split Number' | translate"
                [description]="
                    'Number of major segments/ticks on the gauge arc.'
                        | translate
                "
            >
                <mat-form-field class="w-100">
                    <input
                        matInput
                        type="number"
                        min="1"
                        [(ngModel)]="config.splitNumber"
                        (ngModelChange)="triggerViewRefresh()"
                    />
                </mat-form-field>
            </sp-form-field>

            <mat-checkbox
                [(ngModel)]="config.showPointer"
                (change)="triggerViewRefresh()"
                >{{ 'Show Pointer' | translate }}
            </mat-checkbox>
        </sp-chart-settings-section>

        <sp-chart-settings-section
            [heading]="'Threshold colors' | translate"
            [description]="
                config.enableThresholdColors
                    ? config.thresholdLow + ' / ' + config.thresholdHigh
                    : ('Off' | translate)
            "
        >
            <mat-checkbox
                [(ngModel)]="config.enableThresholdColors"
                (change)="triggerViewRefresh()"
                >{{ 'Enable threshold colors' | translate }}
            </mat-checkbox>

            @if (config.enableThresholdColors) {
                <sp-form-field
                    [level]="3"
                    [label]="'Low Threshold' | translate"
                    [description]="
                        'Value where the low color range ends.' | translate
                    "
                >
                    <mat-form-field class="w-100">
                        <input
                            matInput
                            type="number"
                            [(ngModel)]="config.thresholdLow"
                            (ngModelChange)="triggerViewRefresh()"
                        />
                    </mat-form-field>
                </sp-form-field>

                <sp-form-field
                    [level]="3"
                    [label]="'High Threshold' | translate"
                    [description]="
                        'Value where the medium color range ends and high begins.'
                            | translate
                    "
                >
                    <mat-form-field class="w-100">
                        <input
                            matInput
                            type="number"
                            [(ngModel)]="config.thresholdHigh"
                            (ngModelChange)="triggerViewRefresh()"
                        />
                    </mat-form-field>
                </sp-form-field>

                <sp-form-field
                    [level]="3"
                    [label]="'Low Color' | translate"
                    [description]="
                        'Color used from min up to the low threshold.'
                            | translate
                    "
                >
                    <mat-form-field class="w-100">
                        <input
                            matInput
                            type="color"
                            [(ngModel)]="config.thresholdColorLow"
                            (ngModelChange)="triggerViewRefresh()"
                        />
                    </mat-form-field>
                </sp-form-field>

                <sp-form-field
                    [level]="3"
                    [label]="'Medium Color' | translate"
                    [description]="
                        'Color used between low and high thresholds.'
                            | translate
                    "
                >
                    <mat-form-field class="w-100">
                        <input
                            matInput
                            type="color"
                            [(ngModel)]="config.thresholdColorMedium"
                            (ngModelChange)="triggerViewRefresh()"
                        />
                    </mat-form-field>
                </sp-form-field>

                <sp-form-field
                    [level]="3"
                    [label]="'High Color' | translate"
                    [description]="
                        'Color used above the high threshold.' | translate
                    "
                >
                    <mat-form-field class="w-100">
                        <input
                            matInput
                            type="color"
                            [(ngModel)]="config.thresholdColorHigh"
                            (ngModelChange)="triggerViewRefresh()"
                        />
                    </mat-form-field>
                </sp-form-field>
            }
        </sp-chart-settings-section>
    }
</sp-visualization-config-outer>
