@let config = currentlyConfiguredWidget.visualizationConfig;
<sp-visualization-config-outer [configurationValid]="config.configurationValid">
    <sp-chart-settings-section
        [heading]="'Indicator value' | translate"
        [description]="
            config.valueField?.fullDbName || ('No fields selected' | translate)
        "
        [initiallyOpen]="true"
    >
        <sp-select-single-property-config
            [availableProperties]="fieldProvider.allFields"
            [selectedProperty]="config.valueField"
            (changeSelectedProperty)="updateValue($event)"
        >
        </sp-select-single-property-config>
    </sp-chart-settings-section>
    <sp-chart-settings-section
        [heading]="'Change indicator' | translate"
        [description]="
            config.showDelta ? ('On' | translate) : ('Off' | translate)
        "
        data-cy="chart-section-delta"
    >
        <mat-checkbox
            data-cy="data-explorer-select-delta-checkbox"
            (change)="updateDelta()"
            [(ngModel)]="config.showDelta"
            >{{ 'Show delta indicator' | translate }}
        </mat-checkbox>
    </sp-chart-settings-section>
    <sp-chart-settings-section
        [heading]="'Title and description' | translate"
        [description]="
            config.title || config.description || ('No title' | translate)
        "
        data-cy="chart-section-caption"
    >
        <sp-chart-caption-fields
            [caption]="config"
            chartKey="indicator"
            (captionChange)="triggerViewRefresh()"
        />
    </sp-chart-settings-section>
</sp-visualization-config-outer>
