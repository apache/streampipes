<sp-visualization-config-outer
    [requirement]="
        'Select at least one numeric field for this chart.' | translate
    "
    [configurationValid]="
        currentlyConfiguredWidget.visualizationConfig.configurationValid
    "
>
    <sp-select-color-properties-config
        (changeSelectedProperties)="setSelectedProperties($event)"
        [availableProperties]="numericPlusBooleanFields"
        [selectedProperties]="
            currentlyConfiguredWidget.visualizationConfig
                .selectedTimeSeriesChartProperties
        "
        [currentlyConfiguredWidget]="currentlyConfiguredWidget"
    >
    </sp-select-color-properties-config>

    <sp-chart-settings-section
        [heading]="'Axes' | translate"
        [description]="'Left and right axis settings' | translate"
    >
        <sp-select-axis-options-config
            (viewRefreshEmitter)="triggerViewRefresh()"
            [title]="'left axis' | translate"
            [axisConfig]="
                currentlyConfiguredWidget.visualizationConfig.leftAxis
            "
        >
        </sp-select-axis-options-config>

        <sp-select-axis-options-config
            (viewRefreshEmitter)="triggerViewRefresh()"
            [title]="'right axis' | translate"
            [axisConfig]="
                currentlyConfiguredWidget.visualizationConfig.rightAxis
            "
        >
        </sp-select-axis-options-config>

        <mat-checkbox
            [(ngModel)]="
                currentlyConfiguredWidget.visualizationConfig.showSpike
            "
            (change)="setShowSpikeProperty($event.checked)"
            >{{ 'Axis Pointer' | translate }}
        </mat-checkbox>
    </sp-chart-settings-section>
</sp-visualization-config-outer>
