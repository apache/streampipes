@let config = currentlyConfiguredWidget.visualizationConfig;
<sp-visualization-config-outer [configurationValid]="config.configurationValid">
    <sp-chart-settings-section
        [heading]="'Signal value' | translate"
        [description]="
            config.selectedFieldToObserve?.fullDbName ||
            ('No fields selected' | translate)
        "
        [initiallyOpen]="true"
    >
        <sp-select-single-property-config
            [availableProperties]="fieldProvider.numericFields"
            [selectedProperty]="config.selectedFieldToObserve"
            (changeSelectedProperty)="selectFieldToObserve($event)"
        >
        </sp-select-single-property-config>
    </sp-chart-settings-section>

    <sp-chart-settings-section
        [heading]="'Threshold and warning range' | translate"
        [description]="
            ('Threshold' | translate) +
            ' · ' +
            (config.selectedThreshold ?? '—')
        "
    >
        <sp-form-field [level]="3" [label]="'Threshold' | translate">
            <mat-form-field>
                <input
                    type="text"
                    [(ngModel)]="config.selectedThreshold"
                    matInput
                    (input)="selectThreshold($event.target.value)"
                    [pattern]="'[0-9.,]*'"
                    (keydown)="restrictInput($event)"
                />
            </mat-form-field>
        </sp-form-field>
        <sp-form-field [level]="3" [label]="'With Threshold being' | translate">
            <mat-radio-group
                [(ngModel)]="config.selectedUpperLimit"
                (change)="selectUpperLimit($event.source.value)"
            >
                <mat-radio-button [value]="true">{{
                    'Upper Limit' | translate
                }}</mat-radio-button>
                <mat-radio-button [value]="false">{{
                    'Lower Limit' | translate
                }}</mat-radio-button>
            </mat-radio-group>
        </sp-form-field>
        <sp-form-field [level]="3" [label]="'Warning Range (%)' | translate">
            <mat-form-field>
                <input
                    [(ngModel)]="config.selectedWarningRange"
                    matInput
                    type="text"
                    (input)="selectWarningRange($event.target.value)"
                    [pattern]="'[0-9.,]*'"
                    (keydown)="restrictInput($event)"
                />
                @if (warningRangeInterval) {
                    <div class="warning-range-info text-sm">
                        <small>{{ warningRangeInterval }}</small>
                    </div>
                }
            </mat-form-field>
        </sp-form-field>
        <mat-checkbox
            color="accent"
            [(ngModel)]="config.selectedToShowValue"
            (ngModelChange)="selectToShowValue($event)"
        >
            {{ 'Show Value in Traffic Light' | translate }}
        </mat-checkbox>
    </sp-chart-settings-section>
</sp-visualization-config-outer>
