@let config = currentlyConfiguredWidget.visualizationConfig;
<sp-visualization-config-outer [configurationValid]="config.configurationValid">
    <sp-chart-settings-section
        [heading]="'Distribution field' | translate"
        [description]="
            config.selectedProperty?.fullDbName ||
            ('No fields selected' | translate)
        "
        [initiallyOpen]="true"
    >
        <sp-select-single-property-config
            [availableProperties]="fieldProvider.allFields"
            [selectedProperty]="config.selectedProperty"
            (changeSelectedProperty)="setSelectedProperty($event)"
        >
        </sp-select-single-property-config>
    </sp-chart-settings-section>
    <sp-chart-settings-section
        [heading]="'Bins and value range' | translate"
        [description]="
            config.autoBin
                ? ('Auto-compute number of bins' | translate)
                : ('Number of bins' | translate) + ' · ' + config.numberOfBins
        "
    >
        <mat-checkbox
            [(ngModel)]="config.autoBin"
            (change)="triggerViewRefresh()"
        >
            {{ 'Auto-compute number of bins' | translate }}
        </mat-checkbox>
        @if (!config.autoBin) {
            <sp-form-field [level]="3" [label]="'Number of bins' | translate">
                <mat-form-field color="accent">
                    <input
                        [(ngModel)]="config.numberOfBins"
                        matInput
                        (input)="onNumBinChange($event.target.valueAsNumber)"
                    />
                </mat-form-field>
            </sp-form-field>
        }
        <mat-checkbox
            [(ngModel)]="config.autoDomain"
            (change)="triggerViewRefresh()"
        >
            {{ 'All values' | translate }}
        </mat-checkbox>
        @if (!config.autoDomain) {
            <sp-form-field [level]="3" [label]="'Minimum value' | translate">
                <mat-form-field color="accent">
                    <input
                        [(ngModel)]="config.domainMin"
                        matInput
                        (input)="onDomainMinChange($event.target.valueAsNumber)"
                    />
                </mat-form-field>
            </sp-form-field>
        }
        @if (!config.autoDomain) {
            <sp-form-field [level]="3" [label]="'Maximum value' | translate">
                <mat-form-field color="accent">
                    <input
                        [(ngModel)]="config.domainMax"
                        matInput
                        (input)="onDomainMaxChange($event.target.valueAsNumber)"
                    />
                </mat-form-field>
            </sp-form-field>
        }
    </sp-chart-settings-section>
</sp-visualization-config-outer>
