<div class="sp-dialog-container flex-col">
    <div class="sp-dialog-content p-15 flex-col flex-100">
        @if (pipeline) {
            <div class="info-message">
                {{
                    'Pipeline health monitoring discovered the following issues:'
                        | translate
                }}
            </div>
            <div class="log-message flex-col flex-100">
                @for (
                    notification of pipeline.pipelineNotifications;
                    track notification
                ) {
                    <span class="text-xs" data-cy="pipeline-notification">
                        {{ notification }}
                    </span>
                    <br />
                }
            </div>
        } @else {
            <div class="flex-col items-center flex-100">
                <sp-spinner [diameter]="20"></sp-spinner>
            </div>
        }
    </div>
    <mat-divider></mat-divider>
    <div class="sp-dialog-actions actions-align-right">
        <button
            [disabled]="!pipeline"
            mat-button
            mat-flat-button
            color="accent"
            data-cy="acknowledge-pipeline-notification-btn"
            (click)="acknowledgeAndClose()"
        >
            {{ 'Acknowledge' | translate }}
        </button>
    </div>
</div>
