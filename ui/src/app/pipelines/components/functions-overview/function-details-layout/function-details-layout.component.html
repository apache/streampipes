<sp-basic-view [hideNavbar]="true" [padding]="true">
    @if (functionNotFound) {
        <sp-page-header
            [title]="'Function' | translate"
            icon="functions"
            iconColor="var(--color-pipeline)"
            [backLinkTarget]="['pipelines']"
        ></sp-page-header>
        <div class="function-details-layout__message" role="status">
            {{ 'The desired function was not found!' | translate }}
        </div>
    } @else if (functionDefinition) {
        <sp-page-header
            [title]="functionDefinition.functionId.id"
            [description]="'v' + functionDefinition.functionId.version"
            icon="functions"
            iconColor="var(--color-pipeline)"
            [backLinkTarget]="['pipelines']"
        >
            <div pageActions class="function-details-layout__actions">
                <ng-content select="[pageActions]"></ng-content>
            </div>
        </sp-page-header>

        <sp-page-nav-tabs
            [spNavigationItems]="tabs"
            [activeLink]="activeLink"
            ariaLabel="Details"
        ></sp-page-nav-tabs>

        <div class="function-details-layout__content">
            <ng-content></ng-content>
        </div>
    } @else {
        <div
            class="function-details-layout__loading"
            role="status"
            aria-live="polite"
        >
            <sp-spinner [text]="'Loading' | translate"></sp-spinner>
        </div>
    }
</sp-basic-view>
