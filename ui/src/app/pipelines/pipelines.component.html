<sp-basic-view [hideNavbar]="true" [padding]="true">
    @let pageHeaderAssetLinkType = pageHeaderAssetLinkType$ | async;
    <sp-page-header
        [title]="'Pipelines' | translate"
        [icon]="pageHeaderAssetLinkType?.linkIcon ?? 'play_arrow'"
        [iconColor]="
            pageHeaderAssetLinkType?.linkColor ?? 'var(--color-primary)'
        "
    >
        @if (hasPipelineWritePrivileges) {
            <button
                pageActions
                type="button"
                mat-flat-button
                color="accent"
                (click)="navigateToPipelineEditor()"
                data-cy="pipelines-navigate-to-editor"
            >
                <i class="material-icons" aria-hidden="true">add</i>&nbsp;{{
                    'New Pipeline' | translate
                }}
            </button>
        }
        <button
            pageActions
            type="button"
            mat-icon-button
            color="accent"
            (click)="startPipelineTour()"
            [attr.aria-label]="'Tutorial' | translate"
            [matTooltip]="'Tutorial' | translate"
            [disabled]="tutorialActive"
        >
            <i class="material-icons" aria-hidden="true">school</i>
        </button>
        <button
            pageActions
            type="button"
            mat-icon-button
            color="accent"
            data-cy="refresh-pipelines"
            [attr.aria-label]="'Refresh pipelines' | translate"
            [matTooltip]="'Refresh pipelines' | translate"
            matTooltipPosition="above"
            (click)="getPipelines()"
        >
            <i class="material-icons" aria-hidden="true">refresh</i>
        </button>
    </sp-page-header>

    @if (isAdminRole) {
        <mat-tab-group class="pipelines-page__tabs" color="accent">
            <mat-tab
                [label]="
                    ('Pipelines' | translate) +
                    ' (' +
                    filteredPipelines.length +
                    ')'
                "
            >
                <div class="pipelines-page__tab-content">
                    @if (pipelinesReady) {
                        <sp-pipeline-overview
                            [pipelines]="filteredPipelines"
                            (refreshPipelinesEmitter)="getPipelines()"
                        ></sp-pipeline-overview>
                    }
                </div>
            </mat-tab>
            <mat-tab
                [label]="
                    ('Functions' | translate) + ' (' + functions.length + ')'
                "
            >
                <div class="pipelines-page__tab-content">
                    @if (functionsReady) {
                        <sp-functions-overview
                            [functions]="functions"
                        ></sp-functions-overview>
                    }
                </div>
            </mat-tab>
        </mat-tab-group>
    } @else {
        <div class="pipelines-page__content">
            @if (pipelinesReady) {
                <sp-pipeline-overview
                    [pipelines]="filteredPipelines"
                    (refreshPipelinesEmitter)="getPipelines()"
                ></sp-pipeline-overview>
            }
        </div>
    }
</sp-basic-view>
