@if (asset) {
    <sp-asset-selection-panel
        [editMode]="true"
        [assetModel]="asset"
        [selectedAsset]="selectedAsset"
        (selectedAssetEmitter)="applySelectedAsset($event)"
    >
        <sp-basic-view [hideNavbar]="true" [padding]="true">
            <sp-page-header
                [title]="
                    isNewAsset
                        ? ('New asset' | translate)
                        : selectedAsset?.assetName || ('Asset' | translate)
                "
                [backLinkTarget]="['assets']"
            >
                <button
                    pageActions
                    type="button"
                    mat-flat-button
                    data-cy="save-asset"
                    color="accent"
                    (click)="saveAsset()"
                >
                    <i class="material-icons" aria-hidden="true">save</i>
                    <span>{{ 'Save' | translate }}</span>
                </button>
                @if (!isNewAsset) {
                    <button
                        pageActions
                        type="button"
                        mat-icon-button
                        [matMenuTriggerFor]="optMenu"
                        [attr.aria-label]="'Options' | translate"
                        data-cy="options-asset"
                    >
                        <mat-icon aria-hidden="true">more_vert</mat-icon>
                    </button>
                }
            </sp-page-header>
            <mat-menu #optMenu="matMenu">
                <button
                    mat-menu-item
                    (click)="manageAsset()"
                    data-cy="manage-asset-btn"
                >
                    <mat-icon>settings</mat-icon>
                    <span>{{ 'Manage' | translate }}</span>
                </button>
                <button
                    mat-menu-item
                    (click)="deleteAsset()"
                    data-cy="delete-asset-btn"
                >
                    <mat-icon>clear</mat-icon>
                    <span>{{ 'Delete' | translate }}</span>
                </button>
            </mat-menu>
            @if (asset) {
                <div fxLayout="column">
                    <sp-asset-details-basics
                        (reloadSites)="reloadSites()"
                        [asset]="selectedAsset"
                        [assetModel]="asset"
                        [sites]="sites"
                        [rootNode]="rootNode"
                        [editMode]="true"
                        [isNewAsset]="isNewAsset"
                    >
                    </sp-asset-details-basics>
                </div>
            }
        </sp-basic-view>
    </sp-asset-selection-panel>
}
