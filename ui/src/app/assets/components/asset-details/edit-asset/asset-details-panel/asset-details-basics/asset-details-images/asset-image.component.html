<div>
    <sp-form-field
        [level]="2"
        [label]="'Image' | translate"
        [description]="'Upload an image for this asset' | translate"
    >
        <button
            mat-flat-button
            color="accent"
            type="button"
            class="asset-image-upload"
            data-cy="asset-image-upload"
            (click)="openImageUploadDialog()"
            [disabled]="!editMode"
        >
            <mat-icon>cloud_upload</mat-icon>
            {{ (hasImage ? 'Replace image' : 'Upload image') | translate }}
        </button>

        @if (hasImage) {
            <sp-asset-image-preview
                class="asset-image-preview"
                [asset]="asset"
                [assetModelId]="assetModelId"
                [pendingImage]="pendingImage"
            >
                @if (editMode) {
                    <button
                        type="button"
                        class="asset-image-remove"
                        data-cy="asset-image-remove"
                        [attr.aria-label]="'Remove image' | translate"
                        (click)="openImageRemovalDialog($event)"
                    >
                        <mat-icon>close</mat-icon>
                    </button>
                }
            </sp-asset-image-preview>
        }
    </sp-form-field>
</div>
