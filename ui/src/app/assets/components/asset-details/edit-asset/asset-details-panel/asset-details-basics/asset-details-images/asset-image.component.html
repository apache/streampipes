<div fxLayout="column">
    <sp-form-field
        [level]="2"
        [label]="'Image' | translate"
        [description]="'Upload an image for this asset' | translate"
    >
        <button
            mat-flat-button
            color="accent"
            type="button"
            class="asset-image-upload"
            (click)="openImageUploadDialog()"
            [disabled]="!editMode"
        >
            <mat-icon>cloud_upload</mat-icon>
            {{ (imageFile ? 'Replace image' : 'Upload image') | translate }}
        </button>

        @if (imageFile) {
            <div class="asset-image-thumbnail-wrapper">
                @if (imageUrl) {
                    <img
                        class="asset-image-thumbnail"
                        [src]="imageUrl"
                        [alt]="'Asset image' | translate"
                        (click)="imageViewer.showPopover()"
                    />
                } @else {
                    <mat-icon>broken_image</mat-icon>
                }

                @if (editMode) {
                    <button
                        type="button"
                        class="asset-image-remove"
                        [attr.aria-label]="'Remove image' | translate"
                        (click)="openImageRemovalDialog($event, imageFile)"
                    >
                        <mat-icon>close</mat-icon>
                    </button>
                }
            </div>
        }

        <div
            #imageViewer
            popover="auto"
            class="asset-image-overlay"
            (click)="imageViewer.hidePopover()"
        >
            @if (imageUrl) {
                <img
                    class="viewer-image"
                    [src]="imageUrl"
                    [alt]="'Asset image' | translate"
                    (click)="$event.stopPropagation()"
                />

                <button
                    type="button"
                    class="viewer-close"
                    [attr.aria-label]="'Close image viewer' | translate"
                    (click)="
                        imageViewer.hidePopover(); $event.stopPropagation()
                    "
                >
                    <mat-icon>close</mat-icon>
                </button>
            }
        </div>
    </sp-form-field>
</div>
