<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15" fxLayout="column">
        @if (uploadErrorMessage) {
            <sp-alert-banner
                type="error"
                [title]="'Could not upload image' | translate"
                [description]="uploadErrorMessage"
            ></sp-alert-banner>
        }
        <div class="m-5">
            <mat-form-field
                color="accent"
                class="w-100"
                (click)="fileInput.click()"
            >
                <input matInput [placeholder]="'Image' | translate" disabled />
                <input
                    #fileInput
                    type="file"
                    accept="image/jpeg,image/png"
                    hidden
                    (change)="handleFileInput($event.target.files)"
                />
                @if (selectedUploadFile) {
                    <div>{{ selectedUploadFile.name }}</div>
                }
                <button
                    mat-button
                    matSuffix
                    type="button"
                    color="accent"
                    class="button-icon"
                    [attr.aria-label]="'Upload image' | translate"
                >
                    <mat-icon>image</mat-icon>
                </button>
            </mat-form-field>
            <button
                mat-button
                mat-flat-button
                class="mat-basic mt-10"
                (click)="fileInput.value = ''; clearSelectedFile()"
            >
                {{ 'Clear' | translate }}
            </button>
        </div>
    </div>
    <mat-divider></mat-divider>
    <div class="sp-dialog-actions">
        <button
            mat-flat-button
            color="accent"
            (click)="store()"
            [disabled]="!selectedUploadFile"
        >
            {{ 'Import image' | translate }}
        </button>
        <button mat-flat-button class="mat-basic" (click)="cancel()">
            {{ 'Cancel' | translate }}
        </button>
    </div>
</div>
