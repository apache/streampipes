@if (hasImage || showPlaceholder) {
    <div class="asset-image-preview">
        @if (imageUrl(); as url) {
            <button
                type="button"
                class="asset-image-thumbnail"
                data-cy="asset-image-thumbnail"
                [attr.aria-label]="'View asset image' | translate"
                (click)="openViewer()"
            >
                <img [src]="url" [alt]="'Asset image' | translate" />
            </button>
        } @else {
            <div
                class="asset-image-thumbnail asset-image-placeholder"
                data-cy="asset-image-placeholder"
                [attr.aria-label]="
                    (hasImage ? 'Asset image' : 'No asset image') | translate
                "
            >
                <mat-icon>{{
                    loadFailed() ? 'broken_image' : 'image'
                }}</mat-icon>
            </div>
        }
        <ng-content></ng-content>
    </div>
}

<div
    #imageViewer
    popover="auto"
    class="asset-image-viewer"
    data-cy="asset-image-viewer"
    (click)="closeViewer()"
>
    @if (imageUrl(); as url) {
        <img
            class="asset-image-viewer-image"
            [src]="url"
            [alt]="'Asset image' | translate"
            (click)="$event.stopPropagation()"
        />
        <button
            type="button"
            class="asset-image-viewer-close"
            data-cy="asset-image-viewer-close"
            [attr.aria-label]="'Close image viewer' | translate"
            (click)="closeViewer(); $event.stopPropagation()"
        >
            <mat-icon>close</mat-icon>
        </button>
    }
</div>
