<div class="asset-image-summary">
    @if (imageUrls.length > 0) {
        <button
            type="button"
            class="asset-image-preview"
            aria-label="View asset images"
            (click)="openViewer(0)"
        >
            <img [src]="imageUrls[0]" alt="Asset image" />

            @if (additionalImageCount > 0) {
                <span class="asset-image-count">
                    +{{ additionalImageCount }}
                </span>
            }
        </button>
    } @else {
        <div class="asset-image-placeholder" aria-label="No asset image">
            <mat-icon>image</mat-icon>
        </div>
    }
</div>

@if (selectedImageIndex !== null) {
    <div class="asset-image-overlay" (click)="closeViewer()">
        <button
            type="button"
            class="viewer-close"
            aria-label="Close image viewer"
            (click)="closeViewer()"
        >
            <mat-icon>close</mat-icon>
        </button>

        <div class="viewer-content" (click)="$event.stopPropagation()">
            @if (imageUrls.length > 1) {
                <button
                    type="button"
                    class="viewer-navigation viewer-previous"
                    aria-label="Previous image"
                    (click)="previousImage()"
                >
                    <mat-icon>chevron_left</mat-icon>
                </button>
            }

            <img
                class="viewer-image"
                [src]="imageUrls[selectedImageIndex]"
                alt="Asset image"
            />

            @if (imageUrls.length > 1) {
                <button
                    type="button"
                    class="viewer-navigation viewer-next"
                    aria-label="Next image"
                    (click)="nextImage()"
                >
                    <mat-icon>chevron_right</mat-icon>
                </button>

                <div class="viewer-counter">
                    {{ selectedImageIndex + 1 }} /
                    {{ imageUrls.length }}
                </div>
            }
        </div>
    </div>
}
