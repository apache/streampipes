<div class="asset-image-summary">
    @if (imageUrl) {
        <button
            type="button"
            class="asset-image-preview"
            [attr.aria-label]="'View asset image' | translate"
            (click)="viewerOpen = true"
        >
            <img [src]="imageUrl" [alt]="'Asset image' | translate" />
        </button>
    } @else {
        <div
            class="asset-image-placeholder"
            [attr.aria-label]="'No asset image' | translate"
        >
            <mat-icon>image</mat-icon>
        </div>
    }
</div>

@if (viewerOpen && imageUrl) {
    <div class="asset-image-overlay" (click)="viewerOpen = false">
        <button
            type="button"
            class="viewer-close"
            [attr.aria-label]="'Close image viewer' | translate"
            (click)="viewerOpen = false"
        >
            <mat-icon>close</mat-icon>
        </button>

        <div class="viewer-content" (click)="$event.stopPropagation()">
            <img
                class="viewer-image"
                [src]="imageUrl"
                [alt]="'Asset image' | translate"
            />
        </div>
    </div>
}
