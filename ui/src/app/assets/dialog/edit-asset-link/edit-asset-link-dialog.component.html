<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15 mt-10">
        @if (clonedAssetLink) {
            <div fxFlex="100" fxLayout="column">
                <sp-form-field [level]="3" [label]="'Link Type' | translate">
                    <mat-form-field color="accent">
                        <mat-select
                            fxFlex
                            [(value)]="selectedLinkType"
                            required
                            (selectionChange)="onLinkTypeChanged($event)"
                        >
                            @for (
                                assetLinkType of assetLinkTypes;
                                track assetLinkType
                            ) {
                                <mat-option [value]="assetLinkType">{{
                                    assetLinkType.linkLabel
                                }}</mat-option>
                            }
                        </mat-select>
                    </mat-form-field>
                </sp-form-field>
                @if (resourceSelectionLabel; as label) {
                    <sp-form-field [level]="3" [label]="label">
                        <sp-search-select
                            fxFlex="100"
                            [items]="selectableResources"
                            [value]="currentResource"
                            (valueChange)="onResourceChanged($event)"
                        >
                        </sp-search-select>
                    </sp-form-field>
                }
                <sp-form-field [level]="3" [label]="'Label' | translate">
                    <mat-form-field color="accent">
                        <input
                            matInput
                            [(ngModel)]="clonedAssetLink.linkLabel"
                            [disabled]="true"
                            required
                        />
                    </mat-form-field>
                </sp-form-field>
                <sp-form-field [level]="3" [label]="'Resource ID' | translate">
                    <mat-form-field color="accent">
                        <input
                            matInput
                            [(ngModel)]="clonedAssetLink.resourceId"
                            required
                            [disabled]="true"
                        />
                    </mat-form-field>
                </sp-form-field>
            </div>
        }
    </div>
    <mat-divider></mat-divider>
    <div class="sp-dialog-actions">
        <button
            mat-button
            mat-flat-button
            color="accent"
            (click)="store()"
            style="margin-right: 10px"
            [disabled]="!clonedAssetLink.resourceId"
        >
            {{ (createMode ? 'Create link' : 'Update link') | translate }}
        </button>
        <button
            mat-button
            mat-flat-button
            class="mat-basic"
            (click)="cancel()"
            style="margin-right: 10px"
        >
            {{ 'Cancel' | translate }}
        </button>
    </div>
</div>
