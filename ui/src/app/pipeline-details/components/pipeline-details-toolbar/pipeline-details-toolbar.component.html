<div
    class="pipeline-details-toolbar flex-row flex-wrap justify-between items-center content-center"
>
    <div
        class="pipeline-details-toolbar__views flex-row flex-wrap items-center content-center"
    >
        @if (hasPipelineWritePrivileges) {
            <button
                type="button"
                mat-flat-button
                class="btn-secondary"
                [attr.aria-pressed]="previewState === 'active'"
                [attr.aria-busy]="previewState === 'starting'"
                [disabled]="previewState === 'starting'"
                (click)="togglePreviewEmitter.emit()"
            >
                <mat-icon>visibility</mat-icon>
                @switch (previewState) {
                    @case ('starting') {
                        {{ 'Starting live preview' | translate }}...
                    }
                    @case ('active') {
                        {{ 'Disable live preview' | translate }}
                    }
                    @default {
                        {{ 'Enable live preview' | translate }}
                    }
                }
            </button>
            <button
                type="button"
                mat-flat-button
                class="btn-secondary"
                (click)="openCodeDialogEmitter.emit()"
                data-cy="pipeline-details-view-code"
            >
                <mat-icon>code</mat-icon>
                {{ 'View pipeline as code' | translate }}
            </button>
        }
    </div>
    <div
        class="pipeline-details-toolbar__refresh flex-row flex-wrap justify-end items-center content-center"
    >
        <button
            type="button"
            mat-icon-button
            [matTooltip]="'Refresh metrics' | translate"
            [attr.aria-label]="'Refresh metrics' | translate"
            (click)="reloadMetricsEmitter.emit()"
        >
            <mat-icon>refresh</mat-icon>
        </button>
        <mat-slide-toggle
            [(ngModel)]="autoRefresh"
            (ngModelChange)="autoRefreshChange.emit($event)"
            >{{ 'Auto refresh' | translate }}</mat-slide-toggle
        >
    </div>
</div>
