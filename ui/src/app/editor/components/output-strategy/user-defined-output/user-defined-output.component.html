<div class="flex-col flex-100">
    <div class="flex-row items-center flex-100" style="margin-bottom: 20px">
        <button
            mat-button
            mat-flat-button
            color="accent"
            class="small-button"
            (click)="applyDefaultSchema()"
            style="margin-right: 10px; margin-left: 10px"
            [disabled]="restrictedEditMode"
            data-cy="use-input-schema"
        >
            {{ 'Use input schema' | translate }}
        </button>
    </div>

    @for (ep of outputStrategy.eventProperties; track ep; let i = $index) {
        <div class="flex-row gap-sm flex-100">
            <div class="flex-col basis-30">
                <sp-form-field [level]="3" [label]="'Runtime name' | translate">
                    <mat-form-field class="flex-1" color="accent">
                        <input
                            [(ngModel)]="ep.runtimeName"
                            data-cy="runtime-name"
                            class="flex-1"
                            matInput
                        />
                    </mat-form-field>
                </sp-form-field>
            </div>
            <div class="flex-col basis-30">
                @if (isPrimitiveProperty(ep)) {
                    <sp-form-field
                        [level]="3"
                        [label]="'Runtime type' | translate"
                    >
                        <mat-form-field
                            class="example-full-width"
                            color="accent"
                        >
                            <mat-select
                                [(ngModel)]="ep.runtimeType"
                                [disabled]="restrictedEditMode"
                                data-cy="runtime-type"
                            >
                                @for (
                                    primitive of primitiveClasses;
                                    track primitive
                                ) {
                                    <mat-option [value]="primitive.id">
                                        {{ primitive.label }}
                                    </mat-option>
                                }
                            </mat-select>
                        </mat-form-field>
                    </sp-form-field>
                }
            </div>
            <div class="flex-col basis-30">
                <sp-form-field
                    [level]="3"
                    [label]="'Semantic type' | translate"
                >
                    <mat-form-field class="flex-1" color="accent">
                        <input
                            [(ngModel)]="ep.semanticType"
                            [disabled]="restrictedEditMode"
                            data-cy="semantic-type"
                            class="flex-1"
                            matInput
                        />
                    </mat-form-field>
                </sp-form-field>
            </div>
            <div class="flex-col basis-10">
                <button
                    mat-icon-button
                    class="icon-button"
                    (click)="removeProperty(ep)"
                    [disabled]="restrictedEditMode"
                >
                    <mat-icon class="icon">remove</mat-icon>
                </button>
            </div>
        </div>
    }
    <div>
        <button
            mat-button
            mat-flat-button
            (click)="addProperty()"
            [disabled]="restrictedEditMode"
            data-cy="add-field"
        >
            <mat-icon class="icon">add</mat-icon>
            <span>{{ 'Add field' | translate }}</span>
        </button>
    </div>
</div>
