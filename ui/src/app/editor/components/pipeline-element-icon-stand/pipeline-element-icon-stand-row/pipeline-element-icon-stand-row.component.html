<div
    class="draggable-pipeline-element"
    id="{{ element.appId || element.name.toLowerCase().replaceAll(' ', '_') }}"
    [attr.data-pe]="element.elementId"
    (mouseenter)="updateMouseOver(element.name)"
    (mouseleave)="updateMouseOver('')"
    data-cy="pipeline-element-icon-stand-row"
>
    <div
        matTooltip="{{ element.name }}"
        [matTooltipPosition]="'above'"
        class="draggable-icon-editor tt"
        [ngClass]="activeCssClass"
    >
        <span id="container" class="pe-container">
            <sp-pipeline-element
                id="pe-icon-stand-{{ element.appId }}"
                [iconStandSize]="true"
                [attr.data-cy]="'sp-pipeline-element-' + cypressName"
                [pipelineElement]="element"
            ></sp-pipeline-element>
        </span>
    </div>
    <div class="pipeline-element-row-content">
        <div
            class="element-name-label"
            [ngClass]="{
                'element-name-hover': currentMouseOver,
                'element-name': !currentMouseOver,
            }"
        >
            {{ element.name }}
        </div>
        @if (currentMouseOver && assetContext) {
            <div class="asset-labels">
                @for (asset of assetContext.assets; track asset.id) {
                    <sp-label
                        size="small"
                        tone="neutral"
                        variant="soft"
                        [labelText]="asset.label"
                        [matTooltip]="asset.tooltip"
                    >
                    </sp-label>
                }
            </div>
        }
        @if (currentMouseOver) {
            <div class="element-description">
                {{ element.description }}
            </div>
        }
    </div>
    @if (currentMouseOver) {
        <button
            mat-icon-button
            class="help-button-stand"
            data-cy="help-button-icon-stand"
            [matTooltip]="'Help'"
            [matTooltipPosition]="'above'"
            (click)="openHelpDialog(element)"
        >
            <mat-icon>help</mat-icon>
        </button>
    }
</div>
