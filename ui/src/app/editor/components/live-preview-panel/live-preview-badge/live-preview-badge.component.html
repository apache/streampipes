@if (status(); as status) {
    <button
        type="button"
        class="live-preview-badge sp-no-pan"
        [class.live-preview-badge--selected]="selected()"
        [attr.aria-pressed]="selected()"
        [attr.aria-label]="
            'Show live preview of {{name}}' | translate: { name: elementName() }
        "
        [attr.data-cy]="
            'sp-live-preview-badge-' +
            elementName().toLowerCase().replaceAll(' ', '_')
        "
        (click)="select($event)"
    >
        <span
            [class]="'live-preview-dot live-preview-dot--' + status"
            aria-hidden="true"
        ></span>
        @switch (status) {
            @case ('live') {
                {{ 'Live' | translate }}
            }
            @case ('waiting') {
                {{ 'No events yet' | translate }}
            }
            @case ('error') {
                {{ 'Error' | translate }}
            }
        }
    </button>
}
