<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15 flex-row">
        <div class="flex-col flex-100">
            @for (
                currentElement of currentElements;
                track currentElement;
                let i = $index
            ) {
                <div (click)="create(currentElement)">
                    <div
                        class="m-10 flex-row items-center"
                        [style]="styles[i]"
                        (mouseenter)="changeStyle(i, true)"
                        (mouseleave)="changeStyle(i, false)"
                        [attr.data-cy]="
                            currentElement.name
                                .toLowerCase()
                                .replaceAll(' ', '_')
                        "
                    >
                        <div
                            class="draggable-icon-preview {{
                                currentElementStyle(currentElement)
                            }}"
                        >
                            <sp-pipeline-element
                                [pipelineElement]="currentElement"
                                [iconSize]="true"
                            ></sp-pipeline-element>
                        </div>
                        <div class="flex-col justify-center items-start">
                            <sp-form-label
                                [label]="currentElement.name"
                                [description]="currentElement.description"
                            ></sp-form-label>
                        </div>
                    </div>
                    <mat-divider></mat-divider>
                </div>
            }
        </div>
    </div>
    <mat-divider></mat-divider>
    <div class="sp-dialog-actions">
        <button
            data-cy="cancel-pipeline-element-discovery"
            mat-button
            mat-flat-button
            class="mat-basic"
            (click)="hide()"
        >
            Cancel
        </button>
    </div>
</div>
