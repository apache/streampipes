<nav
    class="menubar-root"
    [class.collapsed]="collapsed()"
    [attr.aria-label]="appConstants.APP_NAME"
    fxLayout="column"
>
    <!-- Header / brand -->
    <div
        class="menubar-header"
        fxLayout="row"
        fxLayoutAlign="space-between center"
    >
        <div class="brand" [class.hidden]="collapsed()">
            <img
                alt="Apache StreamPipes"
                src="assets/img/sp/logo-navigation.png"
            />
        </div>

        <button
            type="button"
            class="collapse-btn"
            (click)="toggleMenubar()"
            [attr.aria-label]="
                (collapsed() ? 'Expand menu' : 'Collapse menu') | translate
            "
            [title]="
                (collapsed() ? 'Expand menu' : 'Collapse menu') | translate
            "
        >
            <mat-icon
                aria-hidden="true"
                class="collapse-icon"
                [class.rotated]="collapsed()"
                >chevron_left</mat-icon
            >
        </button>
    </div>

    <!-- Scrollable content -->
    <div class="menubar-scroll" fxFlex fxLayout="column">
        <!-- Top items (no group) -->
        <div class="top-items">
            @for (item of topItems; track item.title) {
                @if (item.visible !== false) {
                    <button
                        type="button"
                        class="menu-item"
                        [class.menu-item-selected]="item.link === activePage"
                        [attr.data-cy]="'navigation-icon-' + item.link"
                        (click)="go(item.link)"
                        [title]="collapsed() ? item.title : null"
                        [attr.aria-current]="
                            item.link === activePage ? 'page' : null
                        "
                    >
                        <mat-icon aria-hidden="true" class="item-icon">{{
                            item.icon
                        }}</mat-icon>
                        <span
                            class="item-title text-ellipsis text-md"
                            [class.hidden]="collapsed()"
                            >{{ item.title | translate }}</span
                        >
                        @if (shortcutHintsVisible() && !!item.shortcutKey) {
                            <kbd class="shortcut-key">{{
                                item.shortcutKey | uppercase
                            }}</kbd>
                        }
                    </button>
                }
            }
        </div>

        <!-- Grouped sections -->
        <div class="groups">
            @for (group of menuGroups; track group.title) {
                <section class="menu-group text-md">
                    <!-- Group header -->
                    <button
                        type="button"
                        [class.hidden]="collapsed()"
                        class="menu-group-title text-sm"
                        (click)="toggleGroup(group)"
                        [attr.aria-expanded]="!group.collapsed"
                        [attr.aria-controls]="'menu-group-' + group.title"
                    >
                        <span
                            class="group-title-text text-ellipsis"
                            [class.hidden]="collapsed()"
                            >{{ group.title | translate }}</span
                        >
                        <mat-icon
                            class="chevron"
                            [class.rotate]="!group.collapsed"
                            [class.hidden]="collapsed()"
                            >expand_more</mat-icon
                        >
                    </button>

                    <!-- Group items (accordion) -->
                    <div
                        class="menu-group-items"
                        [style.maxHeight]="
                            group.collapsed &&
                            !collapsed() &&
                            !shortcutHintsVisible()
                                ? '0px'
                                : '500px'
                        "
                        [class.instant]="collapsed()"
                        [id]="'menu-group-' + group.title"
                    >
                        @for (item of group.items; track item.title) {
                            @if (item.visible !== false) {
                                <button
                                    type="button"
                                    class="menu-item"
                                    [class.menu-item-selected]="
                                        item.link === activePage
                                    "
                                    [attr.data-cy]="
                                        'navigation-icon-' + item.link
                                    "
                                    (click)="go(item.link)"
                                    [title]="collapsed() ? item.title : null"
                                    [attr.aria-current]="
                                        item.link === activePage ? 'page' : null
                                    "
                                >
                                    <mat-icon
                                        aria-hidden="true"
                                        class="item-icon"
                                        >{{ item.icon }}</mat-icon
                                    >
                                    <span
                                        class="item-title text-md text-ellipsis"
                                        [class.hidden]="collapsed()"
                                        >{{ item.title | translate }}</span
                                    >
                                    @if (
                                        shortcutHintsVisible() &&
                                        !!item.shortcutKey
                                    ) {
                                        <kbd class="shortcut-key">{{
                                            item.shortcutKey | uppercase
                                        }}</kbd>
                                    }
                                </button>
                            }
                        }
                    </div>
                </section>
                @if (collapsed()) {
                    <mat-divider></mat-divider>
                }
            }
        </div>
    </div>
</nav>
