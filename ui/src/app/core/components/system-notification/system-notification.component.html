@if (notification?.enabled) {
    <sp-label
        [tone]="tone"
        size="small"
        variant="solid"
        shape="badge"
        [matTooltip]="notification.message"
        matTooltipPosition="below"
        data-cy="system-notification"
    >
        <span class="notification-text">{{ notification.message }}</span>
    </sp-label>
}
