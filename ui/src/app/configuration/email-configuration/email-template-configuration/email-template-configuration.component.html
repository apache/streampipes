<div class="flex-100">
    <sp-split-section
        [title]="'Mail Template' | translate"
        [subtitle]="'Email Template Configuration' | translate"
    >
        <div class="flex-col flex-100">
            <div class="flex-row items-center flex-100">
                <button
                    mat-button
                    mat-flat-button
                    color="accent"
                    class="small-button action-button"
                    (click)="restoreTemplate()"
                >
                    {{ 'Reset changes' | translate }}
                </button>
            </div>
            <div class="flex-row items-center">
                <sp-alert-banner
                    type="info"
                    [title]="'Use placeholders' | translate"
                    [description]="
                        'You can set various placeholder variables that will be replaced with the actual values when sending an email:'
                            | translate
                    "
                >
                    <div class="mt-10 flex-row flex-wrap gap-2xs">
                        @for (
                            placeholder of allowedPlaceholders;
                            track placeholder
                        ) {
                            <div class="placeholder-item">
                                <span class="placeholder-variable">{{
                                    placeholder.placeholder
                                }}</span>
                                <span class="placeholder-description">{{
                                    placeholder.description
                                }}</span>
                            </div>
                        }
                    </div>
                </sp-alert-banner>
            </div>
            <div class="flex-row flex-100">
                <div class="code-editor-resizable">
                    <ngx-monaco-editor
                        class="code-editor"
                        [(ngModel)]="template.template"
                        [options]="editorOptions"
                    >
                    </ngx-monaco-editor>
                </div>
            </div>
            <div class="mt-10 flex-row">
                <button
                    mat-button
                    mat-flat-button
                    color="accent"
                    class="save-button"
                    (click)="saveTemplate()"
                    [disabled]="template.template === ''"
                >
                    <mat-icon>save</mat-icon
                    ><span>{{ 'Save' | translate }}</span>
                </button>
            </div>
        </div>
    </sp-split-section>
</div>
