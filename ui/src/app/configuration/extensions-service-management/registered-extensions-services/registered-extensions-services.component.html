<div class="flex-col flex-100">
    <table
        class="flex-100"
        mat-table
        [dataSource]="dataSource"
        multiTemplateDataRows
    >
        <ng-container matColumnDef="status">
            <th
                class="flex-row items-center basis-10"
                mat-header-cell
                *matHeaderCellDef
            >
                {{ 'Status' | translate }}
            </th>
            <td
                class="flex-row items-center basis-10"
                mat-cell
                *matCellDef="let element"
            >
                @if (element.status === 'HEALTHY') {
                    <span class="flex-row justify-center items-center">
                        <mat-icon class="service-icon-passing">lens</mat-icon>
                    </span>
                }
                @if (element.status !== 'HEALTHY') {
                    <span class="flex-row justify-center items-center">
                        <mat-icon class="service-icon-critical">lens</mat-icon>
                    </span>
                }
            </td>
        </ng-container>

        <ng-container matColumnDef="group">
            <th
                class="flex-row items-center basis-40"
                mat-header-cell
                *matHeaderCellDef
            >
                {{ 'Service Group' | translate }}
            </th>
            <td
                class="flex-row items-center basis-40"
                mat-cell
                *matCellDef="let element"
            >
                {{ element.svcGroup }}
            </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th
                class="flex-row items-center basis-35"
                mat-header-cell
                *matHeaderCellDef
            >
                {{ 'Service ID' | translate }}
            </th>
            <td
                class="flex-row items-center basis-35"
                mat-cell
                *matCellDef="let element"
            >
                {{ element.svcId }}
            </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th
                class="flex-row justify-end items-center basis-15"
                mat-header-cell
                *matHeaderCellDef
            >
                <button
                    mat-icon-button
                    color="accent"
                    [matTooltip]="'Refresh' | translate"
                    (click)="getRegisteredServices()"
                >
                    <mat-icon>refresh</mat-icon>
                </button>
            </th>
            <td
                class="flex-row justify-end items-center basis-15"
                mat-cell
                *matCellDef="let element"
            >
                <button
                    mat-icon-button
                    color="accent"
                    [matTooltip]="'View running instances' | translate"
                    (click)="openRunningInstances(element)"
                >
                    <mat-icon>list_alt</mat-icon>
                </button>
                <button
                    mat-icon-button
                    color="accent"
                    [matTooltip]="'View service details' | translate"
                    (click)="openServiceDetails(element)"
                >
                    <mat-icon>search</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns"
            class="flex-row"
        ></tr>
        <tr
            mat-row
            *matRowDef="let element; columns: displayedColumns"
            class="service-configuration-row flex-row"
        ></tr>
    </table>
</div>
