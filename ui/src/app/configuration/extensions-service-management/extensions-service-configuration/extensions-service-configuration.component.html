<div class="flex-col flex-100">
    <table
        class="flex-100"
        mat-table
        [dataSource]="dataSource"
        multiTemplateDataRows
    >
        <ng-container matColumnDef="group">
            <th
                class="flex-row items-center basis-45"
                mat-header-cell
                *matHeaderCellDef
            >
                {{ 'Service Group' | translate }}
            </th>
            <td
                class="flex-row items-center basis-45"
                mat-cell
                *matCellDef="let element"
            >
                {{ element.serviceGroup }}
            </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th
                class="flex-row items-center basis-45"
                mat-header-cell
                *matHeaderCellDef
            >
                {{ 'Service Name' | translate }}
            </th>
            <td
                class="flex-row items-center basis-45"
                mat-cell
                *matCellDef="let element"
            >
                {{ element.serviceName }}
            </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th
                class="flex-row justify-end items-center basis-10"
                mat-header-cell
                *matHeaderCellDef
            >
                <button
                    mat-icon-button
                    color="accent"
                    (click)="getConfigurationServices()"
                    [matTooltip]="'Refresh' | translate"
                >
                    <mat-icon>refresh</mat-icon>
                </button>
            </th>
            <td
                class="flex-row justify-end items-center basis-10"
                mat-cell
                *matCellDef="let element"
            >
                <button
                    mat-icon-button
                    color="accent"
                    (click)="expand(element)"
                >
                    <mat-icon>edit</mat-icon>
                </button>
            </td>
        </ng-container>

        <ng-container matColumnDef="expandedDetail">
            <td
                mat-cell
                *matCellDef="let element"
                [attr.colspan]="displayedColumns.length"
            >
                <div
                    class="service-configuration-detail"
                    [@detailExpand]="
                        element === expandedElement ? 'expanded' : 'collapsed'
                    "
                >
                    <div class="flex-100">
                        <sp-service-configs
                            [serviceConfiguration]="element"
                            (updateServiceConfiguration)="
                                updateConfigurationService($event)
                            "
                        ></sp-service-configs>
                    </div>
                </div>
            </td>
        </ng-container>

        <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns"
            class="flex-row"
        ></tr>
        <tr
            mat-row
            *matRowDef="let element; columns: displayedColumns"
            class="service-configuration-row flex-row"
            [class.service-configuration-row-expanded]="
                expandedElement === element
            "
        ></tr>
        <tr
            mat-row
            *matRowDef="let row; columns: ['expandedDetail']"
            class="service-configuration-detail-row"
        ></tr>
    </table>
</div>
