<sp-configuration-box [title]="'Export Settings' | translate">
    <div>
        <sp-configuration-box [title]="'Download Format' | translate">
            <mat-radio-group
                class="sp-radio-group"
                [(ngModel)]="
                    dataRetentionConfig.retentionExportConfig.exportConfig
                        .format
                "
            >
                <mat-radio-button
                    value="json"
                    class="sp-radio-button"
                    data-cy="download-configuration-json"
                >
                    JSON
                </mat-radio-button>
                <mat-radio-button
                    value="csv"
                    class="sp-radio-button"
                    data-cy="download-configuration-csv"
                >
                    CSV
                </mat-radio-button>
                <mat-radio-button
                    value="xlsx"
                    class="sp-radio-button"
                    data-cy="download-configuration-xlsx"
                >
                    EXCEL (XLSX)
                </mat-radio-button>
            </mat-radio-group>
        </sp-configuration-box>
    </div>

    @if (
        dataRetentionConfig.retentionExportConfig.exportConfig.format === 'csv'
    ) {
        <sp-configuration-box [title]="'Delimiter' | translate">
            <mat-radio-group
                [(ngModel)]="
                    dataRetentionConfig.retentionExportConfig.exportConfig
                        .delimiter
                "
                class="sp-radio-group"
            >
                <mat-radio-button
                    value="comma"
                    class="sp-radio-button"
                    data-cy="download-configuration-delimiter-comma"
                    >&nbsp;,
                </mat-radio-button>
                <mat-radio-button
                    value="semicolon"
                    class="sp-radio-button"
                    data-cy="download-configuration-delimiter-semicolon"
                    >&nbsp;;
                </mat-radio-button>
            </mat-radio-group>
        </sp-configuration-box>
    }
    <sp-configuration-box [title]="'Export Provider' | translate">
        <mat-form-field class="sp-select-field">
            <mat-label>{{ 'Select Provider Type' | translate }}</mat-label>
            <mat-select
                [(ngModel)]="selectedProviderType"
                data-cy="exportProvider-select"
                (selectionChange)="onProviderTypeChange($event.value)"
            >
                <mat-option
                    *ngFor="let type of providerType"
                    [value]="type.toUpperCase()"
                    [attr.data-cy]="'exportProvider-' + type.toLowerCase()"
                >
                    {{ type | translate }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field
            appearance="fill"
            class="sp-select-field"
            *ngIf="selectedProviderType == 'S3'"
        >
            <mat-label>{{ 'Select Provider' | translate }}</mat-label>
            <mat-select
                [(ngModel)]="selectedProviderId"
                data-cy="exportProviderId-select"
            >
                <mat-option
                    *ngFor="let provider of availableS3ExportProvider"
                    [value]="provider.providerId"
                    [attr.data-cy]="'exportProviderId-' + provider.providerId"
                >
                    {{
                        'Endpoint: ' +
                            provider.endPoint +
                            ' Bucket: ' +
                            provider.bucketName
                    }}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </sp-configuration-box>
</sp-configuration-box>
