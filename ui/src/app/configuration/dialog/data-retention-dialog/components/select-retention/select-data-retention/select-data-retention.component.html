<sp-configuration-box [title]="'Data Retention' | translate">
    <mat-radio-group
        class="sp-radio-group"
        [(ngModel)]="dataRetentionConfig.interval"
    >
        <mat-radio-button
            value="daily"
            class="sp-radio-button"
            data-cy="retention-configuration-daily"
        >
            {{ 'daily' | translate }}
        </mat-radio-button>
        <mat-radio-button
            value="monthly"
            class="sp-radio-button"
            data-cy="retention-configuration-monthly"
        >
            {{ 'monthly' | translate }}
        </mat-radio-button>
    </mat-radio-group>
</sp-configuration-box>
