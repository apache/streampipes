<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15">
        <div
            fxLayoutAlign="center center"
            fxLayout="column"
            data-cy="connection-testing-in-progress"
        >
            <div fxLayout="row" fxLayoutAlign="space-around">
                <b
                    ><h4>{{ currentStatus }}</h4></b
                >
            </div>
        </div>

        @if (isError) {
            <div fxLayout="column" class="p-10">
                <div fxLayout="row" fxLayoutAlign="space-around">
                    <sp-exception-message [message]="errorMessage">
                    </sp-exception-message>
                </div>
            </div>
        }

        @if (isInProgress) {
            <div
                fxFlex="100"
                fxLayoutAlign="center center"
                fxLayout="column"
                data-cy="connection-testing-in-progress"
            >
                <div fxLayout="row" fxLayoutAlign="space-around">
                    <mat-spinner
                        [mode]="'indeterminate'"
                        color="accent"
                    ></mat-spinner>
                </div>
            </div>
        }
    </div>

    <mat-divider></mat-divider>

    <div class="sp-dialog-actions actions-align-right">
        <button
            mat-button
            mat-flat-button
            class="mat-basic"
            (click)="close(false)"
        >
            Close
        </button>
    </div>
</div>
