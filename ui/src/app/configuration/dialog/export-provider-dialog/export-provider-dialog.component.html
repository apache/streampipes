<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15">
        <mat-form-field appearance="fill" class="sp-select-field">
            <mat-label>{{ 'Select Provider' | translate }}</mat-label>
            <mat-select
                [(ngModel)]="exportProviderSetting.providerType"
                data-cy="exportProvider-select"
            >
                <mat-option value="FOLDER" data-cy="exportProvider-local">
                    {{ 'local' | translate }}
                </mat-option>
                <mat-option value="S3" data-cy="exportProvider-s3">
                    {{ 'S3' | translate }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <div
            class="s3-config-container"
            *ngIf="exportProviderSetting.providerType === 'S3'"
        >
            <mat-form-field class="w-100">
                <mat-label>{{ 'Access Key' | translate }}</mat-label>
                <input
                    matInput
                    [(ngModel)]="exportProviderSetting.accessKey"
                    placeholder="{{ 'Enter Access Key' | translate }}"
                    data-cy="exportProvider-s3-accessKey"
                />
            </mat-form-field>

            <mat-form-field class="w-100">
                <mat-label>{{ 'Secret Key' | translate }}</mat-label>
                <input
                    matInput
                    [(ngModel)]="exportProviderSetting.secretKey"
                    placeholder="{{ 'Enter Secret Key' | translate }}"
                    type="password"
                    data-cy="exportProvider-s3-secretKey"
                />
            </mat-form-field>

            <mat-form-field class="w-100">
                <mat-label>{{ 'Endpoint' | translate }}</mat-label>
                <input
                    matInput
                    [(ngModel)]="exportProviderSetting.endPoint"
                    placeholder="{{ 'Enter Endpoint' | translate }}"
                    data-cy="exportProvider-s3-endpoint"
                />
            </mat-form-field>

            <mat-form-field class="w-100">
                <mat-label>{{ 'Bucket' | translate }}</mat-label>
                <input
                    matInput
                    [(ngModel)]="exportProviderSetting.bucketName"
                    placeholder="{{ 'Enter Bucket Name' | translate }}"
                    data-cy="exportProvider-s3-bucket"
                />
            </mat-form-field>

            <mat-form-field class="w-100">
                <mat-label>{{ 'Region' | translate }}</mat-label>
                <mat-select
                    [(ngModel)]="exportProviderSetting.awsRegion"
                    placeholder="{{ 'Select Region' | translate }}"
                    data-cy="exportProvider-s3-region"
                >
                    <mat-option
                        *ngFor="let region of awsRegions"
                        [value]="region"
                    >
                        {{ region }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <mat-divider></mat-divider>

        <div class="sp-dialog-actions actions-align-right">
            <button
                mat-button
                mat-flat-button
                class="mat-basic"
                (click)="addData()"
            >
                Save
            </button>

            <button
                mat-button
                mat-flat-button
                class="mat-basic"
                (click)="close(false)"
            >
                Close
            </button>
        </div>
    </div>
</div>
