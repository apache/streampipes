<div class="sp-dialog-container" data-cy="audit-download-dialog">
    @if (dialogModel && exportConfig) {
        <div class="sp-dialog-content">
            <mat-horizontal-stepper #stepper>
                <mat-step>
                    <sp-audit-select-data
                        [dialogModel]="dialogModel"
                        [exportConfig]="exportConfig"
                    />
                    <ng-template matStepLabel>{{
                        'Select Data' | translate
                    }}</ng-template>
                </mat-step>
                <mat-step>
                    <sp-export-format-selection
                        [formatExportConfig]="exportConfig.formatExportConfig"
                        dataCyPrefix="audit-download-format"
                        delimiterDataCyPrefix="audit-download"
                    />
                    <ng-template matStepLabel>{{
                        'Export Format' | translate
                    }}</ng-template>
                </mat-step>
                <mat-step>
                    <sp-download-status
                        [downloading]="downloading"
                        [finished]="!downloading && !downloadFailed"
                        [failed]="downloadFailed"
                        errorMessage="Audit events could not be downloaded. Try again."
                    />
                    <ng-template matStepLabel>{{
                        'Download' | translate
                    }}</ng-template>
                </mat-step>
            </mat-horizontal-stepper>
        </div>

        <mat-divider />
        <div class="sp-dialog-actions actions-align-left">
            <button
                mat-button
                class="mat-basic"
                data-cy="audit-download-close-button"
                (click)="close()"
            >
                {{ 'Close' | translate }}
            </button>
            @if (stepper.selectedIndex === 0) {
                <button
                    mat-flat-button
                    color="accent"
                    data-cy="audit-download-next-button"
                    [disabled]="!hasSelectedColumns"
                    (click)="stepper.next()"
                >
                    {{ 'Next' | translate }}
                </button>
            }
            @if (stepper.selectedIndex > 0) {
                <button
                    mat-button
                    class="mat-basic"
                    data-cy="audit-download-previous-button"
                    (click)="stepper.previous()"
                >
                    {{ 'Previous' | translate }}
                </button>
            }
            @if (stepper.selectedIndex === 1) {
                <button
                    mat-flat-button
                    color="accent"
                    data-cy="audit-download-download-button"
                    [disabled]="downloading"
                    (click)="download(stepper)"
                >
                    {{ 'Download' | translate }}
                </button>
            }
        </div>
    }
</div>
