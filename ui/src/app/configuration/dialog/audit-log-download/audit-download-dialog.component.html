<div class="sp-dialog-container">
    @if (dialogModel && exportConfig) {
        <div class="sp-dialog-content">
            <mat-horizontal-stepper #stepper>
                <mat-step>
                    <sp-audit-select-data
                        [dialogModel]="dialogModel"
                        [exportConfig]="exportConfig"
                    />
                    <ng-template matStepLabel>{{
                        'Select Data' | translate
                    }}</ng-template>
                </mat-step>
                <mat-step>
                    <sp-audit-select-format
                        [formatExportConfig]="exportConfig.formatExportConfig"
                    />
                    <ng-template matStepLabel>{{
                        'Export Format' | translate
                    }}</ng-template>
                </mat-step>
                <mat-step>
                    <sp-audit-download
                        [downloading]="downloading"
                        [downloadFailed]="downloadFailed"
                    />
                    <ng-template matStepLabel>{{
                        'Download' | translate
                    }}</ng-template>
                </mat-step>
            </mat-horizontal-stepper>
        </div>

        <mat-divider />
        <div class="sp-dialog-actions actions-align-left">
            <button mat-button class="mat-basic" (click)="close()">
                {{ 'Close' | translate }}
            </button>
            @if (stepper.selectedIndex === 0) {
                <button
                    mat-flat-button
                    color="accent"
                    [disabled]="!hasSelectedColumns"
                    (click)="stepper.next()"
                >
                    {{ 'Next' | translate }}
                </button>
            }
            @if (stepper.selectedIndex > 0) {
                <button
                    mat-button
                    class="mat-basic"
                    (click)="stepper.previous()"
                >
                    {{ 'Previous' | translate }}
                </button>
            }
            @if (stepper.selectedIndex === 1) {
                <button
                    mat-flat-button
                    color="accent"
                    [disabled]="downloading"
                    (click)="download(stepper)"
                >
                    {{ 'Download' | translate }}
                </button>
            }
        </div>
    }
</div>
