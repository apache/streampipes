<div>
    <sp-split-section
        [title]="'Files' | translate"
        [subtitle]="
            'Upload and manage files that are used by adapters or pipeline elements.'
                | translate
        "
    >
        <div class="flex-row items-start gap-sm" section-actions>
            <button
                mat-flat-button
                color="accent"
                (click)="openFileUploadDialog()"
                data-cy="sp-open-file-upload-dialog"
                class="mr-10"
            >
                <mat-icon>cloud_upload</mat-icon>
                {{ 'Upload new file' | translate }}
            </button>
        </div>

        <div class="flex-col flex-100">
            <sp-file-overview
                class="flex-100"
                #fileOverviewComponent
            ></sp-file-overview>
        </div>
    </sp-split-section>
</div>
