<sp-basic-view [hideNavbar]="true" [padding]="true">
    <sp-page-header
        [title]="'Settings' | translate"
        icon="settings"
        iconColor="var(--color-primary)"
    ></sp-page-header>

    <sp-page-nav-tabs
        [spNavigationItems]="tabs"
        [activeLink]="activeLink"
        [ariaLabel]="'Settings' | translate"
    ></sp-page-nav-tabs>

    <div class="configuration-section-host__content">
        @if (sectionComponent) {
            <ng-container *ngComponentOutlet="sectionComponent"></ng-container>
        }
    </div>
</sp-basic-view>
