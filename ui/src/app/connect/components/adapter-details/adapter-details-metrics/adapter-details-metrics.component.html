<sp-adapter-details-layout
    [adapter]="adapter"
    [adapterNotFound]="adapterNotFound"
    [tabs]="tabs"
    activeLink="metrics"
>
    <button
        pageActions
        type="button"
        mat-icon-button
        color="accent"
        [disabled]="refreshing"
        [attr.aria-label]="'Refresh' | translate"
        [matTooltip]="'Refresh' | translate"
        (click)="triggerUpdate()"
    >
        <mat-icon aria-hidden="true">{{
            refreshing ? 'hourglass_top' : 'refresh'
        }}</mat-icon>
    </button>

    @if (adapter && adapterMetrics) {
        <div fxFlex="100" fxLayout="column">
            <sp-simple-metrics
                [elementName]="adapter.name"
                [lastPublishedLabel]="'Last published message' | translate"
                [statusValueLabel]="'Published messages' | translate"
                [lastTimestamp]="adapterMetrics.lastTimestamp"
                [statusValue]="adapterMetrics.messagesOut.counter"
            >
            </sp-simple-metrics>
        </div>
    }
</sp-adapter-details-layout>
