<sp-basic-view [padding]="true" [hideNavbar]="true">
    <sp-page-header [title]="pageTitle" [backLinkTarget]="['connect']">
        @if (isEditMode) {
            <button
                pageActions
                type="button"
                mat-icon-button
                [matMenuTriggerFor]="optMenu"
                [attr.aria-label]="'Options' | translate"
                data-cy="options-adapter"
            >
                <mat-icon aria-hidden="true">more_vert</mat-icon>
            </button>
        }
    </sp-page-header>
    <mat-menu #optMenu="matMenu">
        <button
            mat-menu-item
            (click)="manageAdapter()"
            data-cy="manage-adapter-btn"
        >
            <mat-icon>settings</mat-icon>
            <span>{{ 'Manage' | translate }}</span>
        </button>
        <button
            mat-menu-item
            (click)="deleteAdapter()"
            data-cy="delete-adapter-btn"
        >
            <mat-icon>clear</mat-icon>
            <span>{{ 'Delete' | translate }}</span>
        </button>
    </mat-menu>
    @let adapterConfigurationState = state();
    @if (adapterConfigurationState) {
        @if (adapterConfigurationState.adapterDescription) {
            <div fxLayout="column" fxLayoutAlign="center stretch">
                <mat-horizontal-stepper
                    [linear]="true"
                    #stepper
                    color="accent"
                    class="stepper"
                >
                    <mat-step>
                        <ng-template matStepLabel
                            >{{ 'Settings' | translate }}
                        </ng-template>
                        <sp-adapter-settings
                            [adapterDescription]="
                                adapterConfigurationState.adapterDescription
                            "
                            (updateAdapterDescriptionEmitter)="
                                adapterDescription = $event
                            "
                            (nextEmitter)="nextAdapterSettings()"
                            (cancelEmitter)="navigateToAdapterCatalog()"
                        >
                        </sp-adapter-settings>
                    </mat-step>

                    <mat-step>
                        <ng-template matStepLabel
                            >{{ 'Configure schema' | translate }}
                        </ng-template>
                        <sp-configure-schema
                            [adapterDescription]="
                                adapterConfigurationState.adapterDescription
                            "
                            (nextEmitter)="nextConfigureSchema()"
                            (goBackEmitter)="goBack()"
                            (cancelEmitter)="navigateToAdapterCatalog()"
                        >
                        </sp-configure-schema>
                    </mat-step>

                    <mat-step>
                        <ng-template matStepLabel
                            >{{ 'Configure fields' | translate }}
                        </ng-template>

                        <sp-configure-fields
                            fxLayout="column"
                            fxFlex="100"
                            [adapterDescription]="
                                adapterConfigurationState.adapterDescription
                            "
                            [isEditMode]="isEditMode"
                            (nextEmitter)="nextConfigureFields()"
                            (goBackEmitter)="goBack()"
                            (cancelEmitter)="navigateToAdapterCatalog()"
                        >
                        </sp-configure-fields>
                    </mat-step>
                    <mat-step>
                        <ng-template matStepLabel
                            >{{ 'Start adapter' | translate }}
                        </ng-template>
                        <sp-start-adapter-configuration
                            [adapterDescription]="
                                adapterConfigurationState.adapterDescription
                            "
                            [eventSchema]="
                                adapterDescription.dataStream.eventSchema
                            "
                            [isEditMode]="isEditMode"
                            [permission]="pendingPermission"
                            [selectedAssets]="pendingSelectedAssets"
                            [deselectedAssets]="pendingDeselectedAssets"
                            [originalAssets]="pendingOriginalAssets"
                            [addToAssets]="shouldAddToAssets"
                            (cancelEmitter)="navigateToAdapterCatalog()"
                            (goBackEmitter)="goBack()"
                            (adapterStartedEmitter)="adapterWasStarted()"
                        >
                        </sp-start-adapter-configuration>
                    </mat-step>
                </mat-horizontal-stepper>
            </div>
        }
    }
</sp-basic-view>
