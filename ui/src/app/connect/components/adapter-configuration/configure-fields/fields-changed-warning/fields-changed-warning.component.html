<div class="warning-container" fxLayout="column">
    <sp-alert-banner
        type="warning"
        [title]="'The adapter configuration has changed'"
        [description]="
            'This might affect the structure of the event. It is recommended to reload the sample to ensure data consistency.'
        "
    >
    </sp-alert-banner>

    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="12px">
        <button
            mat-flat-button
            color="accent"
            (click)="acknowledgeNoChanges()"
            matTooltip="Proceed with current sample"
        >
            {{ 'Nothing changed' | translate }}
        </button>

        <button mat-flat-button color="accent" (click)="refreshFields()">
            <mat-icon>refresh</mat-icon>
            {{ 'Reload Fields' | translate }}
        </button>
    </div>
</div>
