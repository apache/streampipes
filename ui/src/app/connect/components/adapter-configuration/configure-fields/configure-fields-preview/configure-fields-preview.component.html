<div fxFlex="100" fxLayout="row" fxLayoutGap="15px">
    <div fxFlex="50" fxLayout="column">
        <sp-basic-inner-panel
            [showTitle]="true"
            innerPadding="0"
            [panelTitle]="'Original (Parsed)' | translate"
        >
            <pre
                [innerHTML]="originalPreview | jsonpretty"
                class="preview-text"
                data-cy="schema-preview-original-event"
            ></pre>
        </sp-basic-inner-panel>
    </div>

    <div fxFlex="50" fxLayout="column">
        <sp-basic-inner-panel
            [showTitle]="true"
            [panelTitle]="'Result' | translate"
            innerPadding="0"
            fxFlex="100"
            data-cy="connect-schema-update-preview"
        >
            <div header fxLayoutAlign="end center" fxFlex="100">
                <button
                    color="accent"
                    mat-button
                    data-cy="connect-schema-update-preview-btn"
                    matTooltip="Refresh event preview"
                    (click)="refreshEventPreview()"
                >
                    <mat-icon>refresh</mat-icon>
                    <span>&nbsp;{{ 'Update result preview' | translate }}</span>
                </button>
            </div>
            @if (resultPreview) {
                <pre
                    [innerHTML]="resultPreview | jsonpretty"
                    class="preview-text"
                    data-cy="configure-fields-event-preview-result"
                ></pre>
            }
        </sp-basic-inner-panel>
    </div>
</div>
