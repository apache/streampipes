<section class="jv p-sm">
    <div class="jv__content" [class.is-empty]="!hasValue()">
        @if (hasValue()) {
            @switch (mode) {
                @case ('raw') {
                    <pre
                        class="raw"
                    ><code [attr.data-cy]="dataCy">{{ prettyJson() }}</code></pre>
                }
                @case ('tree') {
                    <div class="tree">
                        <sp-adapter-event-preview-node
                            [keyLabel]="rootLabel"
                            [value]="value"
                            [expanded]="true"
                            [maxStringLength]="maxStringLength"
                            [sortKeys]="sortKeys"
                        />
                    </div>
                }
            }
        }
    </div>
</section>
