<article class="adapter-catalog-item">
    <div class="adapter-catalog-item__identity">
        <div class="adapter-icon">
            @if (iconUrl) {
                <img [src]="iconUrl" class="icon" alt="" />
            }
        </div>
        <h2 class="adapter-name">{{ adapter.name }}</h2>
    </div>
    <div class="adapter-catalog-item__actions">
        <button
            mat-flat-button
            data-cy="adapter-catalog-create"
            (click)="selectAdapter(adapter.appId)"
            [matTooltip]="'Create adapter' | translate"
            [attr.aria-label]="
                ('Create adapter' | translate) + ': ' + adapter.name
            "
        >
            <mat-icon>add</mat-icon>
            <span>{{ 'Create' | translate }}</span>
        </button>
        <button
            mat-flat-button
            class="mat-basic"
            (click)="openDocumentation($event)"
            [matTooltip]="'Show documentation' | translate"
            [attr.aria-label]="
                ('Show documentation' | translate) + ': ' + adapter.name
            "
        >
            <mat-icon>menu_book</mat-icon>
            <span>{{ 'Docs' | translate }}</span>
        </button>
    </div>
</article>
