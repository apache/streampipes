@if (isPrimitiveProperty && !isTimestampProperty && isNumericProperty) {
    <sp-split-section [title]="'Unit Transformation' | translate" [level]="3">
        <sp-form-field
            [level]="3"
            [label]="'Unit conversion' | translate"
            [description]="
                'Converts the field value from the given measurement unit to the provided target unit'
                    | translate
            "
        >
            <div class="flex-row">
                <div class="w-100 flex-row items-center basis-45">
                    <mat-form-field
                        class="w-100 flex-100"
                        color="accent"
                        subscriptSizing="dynamic"
                    >
                        <input
                            matInput
                            placeholder="Unit"
                            [matAutocomplete]="auto"
                            [formControl]="currentUnitStateCtrl"
                            [attr.disabled]="transformUnitEnable ? '' : null"
                            data-cy="connect-schema-unit-from-dropdown"
                        />
                        <mat-autocomplete
                            #auto="matAutocomplete"
                            [panelWidth]="'300px'"
                        >
                            @for (unit of filteredUnits | async; track unit) {
                                <mat-option
                                    [value]="unit.label"
                                    [attr.data-cy]="unit.resource"
                                    (click)="changeSourceUnit(unit)"
                                >
                                    {{ unit.label }}
                                </mat-option>
                            }
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div class="flex-row justify-center items-center basis-10">
                    <button
                        mat-icon-button
                        [disabled]="!this.cachedProperty.measurementUnit"
                        (click)="transformUnit()"
                        color="accent"
                        class="form-group self-center"
                        data-cy="connect-schema-unit-transform-btn"
                    >
                        @if (!transformUnitEnable) {
                            <mat-icon>arrow_forward</mat-icon>
                        }
                        @if (transformUnitEnable) {
                            <mat-icon style="transform: rotate(180deg)"
                                >arrow_forward</mat-icon
                            >
                        }
                    </button>
                </div>
                <div class="flex-row items-center basis-45">
                    @if (transformUnitEnable) {
                        <mat-form-field
                            class="w-100 flex-100"
                            color="accent"
                            subscriptSizing="dynamic"
                        >
                            <mat-select
                                placeholder="New Unit"
                                [(ngModel)]="selectUnit"
                                [formControl]="newUnitStateCtrl"
                                [compareWith]="compareFn"
                                data-cy="connect-schema-unit-to-dropdown"
                            >
                                @for (
                                    unit of possibleUnitTransformations;
                                    track unit
                                ) {
                                    <mat-option
                                        [value]="unit"
                                        (click)="changeTargetUnit(unit)"
                                    >
                                        {{ unit.label }}
                                    </mat-option>
                                }
                            </mat-select>
                        </mat-form-field>
                    }
                </div>
            </div>
        </sp-form-field>
    </sp-split-section>
}
