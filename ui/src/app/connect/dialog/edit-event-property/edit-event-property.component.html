<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15">
        <div fxFlex="100" fxLayout="column">
            <form #propertyForm="ngForm" fxLayout="column">
                <div fxLayout="column" fxLayoutAlign="start" fxFlex="100">
                    <sp-split-section
                        [level]="3"
                        [title]="'Basics' | translate"
                    >
                        <sp-form-field
                            [level]="3"
                            [label]="'Field label' | translate"
                            [description]="
                                'A label for better readability' | translate
                            "
                        >
                            <mat-form-field class="w-100" color="accent">
                                <input
                                    matInput
                                    placeholder="Label"
                                    name="label"
                                    id="label"
                                    [(ngModel)]="cachedProperty.label"
                                />
                            </mat-form-field>
                        </sp-form-field>
                        <sp-form-field
                            [level]="3"
                            [label]="'Field description' | translate"
                            [description]="
                                'A description for better readability'
                                    | translate
                            "
                        >
                            <mat-form-field class="full-width" color="accent">
                                <textarea
                                    matInput
                                    name="description"
                                    placeholder="Description"
                                    id="description"
                                    [(ngModel)]="cachedProperty.description"
                                    cols="20"
                                    rows="2"
                                >
                                </textarea>
                            </mat-form-field>
                        </sp-form-field>
                        <sp-form-field
                            [level]="3"
                            [label]="'Field runtime name' | translate"
                            [description]="
                                'Identifies the field in the underlying runtime format'
                                    | translate
                            "
                        >
                            <div
                                [attr.id]="
                                    'input-runtime-name-' + cachedProperty.label
                                "
                                fxFlex="100"
                            >
                                <mat-form-field class="w-100" color="accent">
                                    <input
                                        matInput
                                        placeholder="RuntimeName"
                                        name="runtimename"
                                        id="runtimename"
                                        data-cy="connect-edit-field-runtime-name"
                                        disabled="true"
                                        [(ngModel)]="cachedProperty.runtimeName"
                                    />
                                </mat-form-field>
                            </div>
                        </sp-form-field>
                    </sp-split-section>

                    <sp-edit-schema-transformation
                        [cachedProperty]="cachedProperty"
                        [isTimestampProperty]="isTimestampProperty"
                        [isNestedProperty]="isEventPropertyNested"
                        [isListProperty]="isEventPropertyList"
                        [isPrimitiveProperty]="isEventPropertyPrimitive"
                        (dataTypeChanged)="handleDataTypeChange()"
                    >
                    </sp-edit-schema-transformation>

                    @if (!isTimestampProperty && isEventPropertyPrimitive) {
                        <sp-edit-unit-transformation
                            [cachedProperty]="cachedProperty"
                            [originalProperty]="eventProperty"
                            [isTimestampProperty]="isTimestampProperty"
                            [isNumericProperty]="isNumericProperty"
                            [isPrimitiveProperty]="isEventPropertyPrimitive"
                        >
                        </sp-edit-unit-transformation>
                    }
                </div>
            </form>
        </div>
    </div>
    <mat-divider></mat-divider>
    <div class="sp-dialog-actions">
        <button
            mat-button
            mat-flat-button
            color="accent"
            [disabled]="isSaveBtnEnabled"
            (click)="save(); isSaveBtnEnabled = false"
            style="margin-right: 10px"
            data-cy="sp-save-edit-property"
        >
            Save
        </button>
        <button
            mat-button
            mat-flat-button
            class="mat-basic"
            (click)="dialogRef.close()"
        >
            Close
        </button>
    </div>
</div>
