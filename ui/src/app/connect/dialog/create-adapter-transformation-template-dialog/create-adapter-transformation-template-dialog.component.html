<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15">
        <sp-form-field [level]="3" [label]="'Template name' | translate">
            <mat-form-field>
                <input matInput [(ngModel)]="templateName" />
            </mat-form-field>
        </sp-form-field>

        <sp-form-field [level]="3" [label]="'Template description' | translate">
            <mat-form-field>
                <input matInput [(ngModel)]="templateDescription" />
            </mat-form-field>
        </sp-form-field>

        <sp-form-field [level]="3" [label]="'Script' | translate">
            <textarea
                matInput
                [(ngModel)]="script"
                class="code-input"
                rows="15"
            >
            </textarea>
        </sp-form-field>
    </div>
    <mat-divider></mat-divider>
    <div class="sp-dialog-actions" fxLayoutGap="10px">
        <button mat-flat-button (click)="save()">
            <mat-icon>save</mat-icon>
            <span>{{ 'Save' | translate }}</span>
        </button>
        <button class="mat-basic" mat-flat-button (click)="close()">
            Close
        </button>
    </div>
</div>
