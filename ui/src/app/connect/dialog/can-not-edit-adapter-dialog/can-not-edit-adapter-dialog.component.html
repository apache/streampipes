<div class="sp-dialog-container">
    <div class="sp-dialog-content p-15">
        <div class="flex-col">
            <div class="flex-col">
                <div
                    class="flex-col justify-center items-center flex-100"
                    data-cy="can-not-edit-adapter-dialog-warning"
                >
                    <b><h4>This adapter can not be edited.</h4></b>
                    <h5>It is used in the following pipelines:</h5>
                </div>
            </div>
            <div class="w-100 flex-col flex-100">
                @for (pipeline of pipelines; track pipeline) {
                    <div
                        class="mat-elevation-z1 mt-10 flex-col flex-100"
                        data-cy="adapter-in-pipeline"
                    >
                        <div class="p-15 flex-col flex-100">
                            {{ pipeline.name }}
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
    <mat-divider></mat-divider>
    <div class="sp-dialog-actions actions-align-right">
        <button
            mat-button
            mat-flat-button
            class="mat-basic"
            (click)="close()"
            data-cy="can-not-edit-adapter-dialog-close"
        >
            Close
        </button>
    </div>
</div>
