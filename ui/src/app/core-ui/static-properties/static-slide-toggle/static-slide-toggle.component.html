<div [formGroup]="parentForm" id="formWrapper" class="flex-col flex-100">
    <div class="flex-row flex-100">
        <mat-slide-toggle
            class="flex-1"
            formControlName="{{ fieldName }}"
            color="accent"
            [attr.data-cy]="fieldName"
        >
            {{ staticProperty.description }}
        </mat-slide-toggle>
    </div>
</div>
