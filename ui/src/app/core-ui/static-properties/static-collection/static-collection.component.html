<div class="flex-col flex-100">
    @for (property of staticProperty.members; track property; let i = $index) {
        <div class="flex-row justify-between items-center">
            <div class="flex-100">
                <ng-container
                    [ngTemplateOutlet]="renderStaticProperty"
                    [ngTemplateOutletContext]="ctxFor(property, i)"
                />
            </div>
            <div style="width: 50px" class="flex-row justify-end items-center">
                <button mat-icon-button class="icon-button" (click)="remove(i)">
                    <mat-icon class="icon">remove</mat-icon>
                </button>
            </div>
        </div>
    }
    <div class="flex-1">
        <sp-add-to-collection
            (addPropertyEmitter)="add($event)"
            [staticPropertyTemplate]="staticProperty.staticPropertyTemplate"
        ></sp-add-to-collection>
    </div>
</div>
