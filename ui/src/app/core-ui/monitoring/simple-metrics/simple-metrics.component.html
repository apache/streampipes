<div class="simple-metrics" fxLayout="column">
    <sp-basic-header-title-component
        [title]="elementName + ' - Metrics'"
    ></sp-basic-header-title-component>
    <div
        class="simple-metrics__grid"
        fxLayout="row"
        fxLayoutAlign="start stretch"
        fxLayoutGap="var(--space-md)"
        fxFlex="100"
    >
        <sp-status-widget
            fxFlex="50"
            [label]="lastPublishedLabel"
            widgetHeight="7.5rem"
            [statusValue]="
                lastTimestamp === 0 ? 'n/a' : (lastTimestamp | date: 'medium')
            "
        >
        </sp-status-widget>
        <sp-status-widget
            fxFlex="50"
            [label]="statusValueLabel"
            widgetHeight="7.5rem"
            [statusValue]="statusValue"
        >
        </sp-status-widget>
    </div>
</div>
