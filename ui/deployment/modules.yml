spAssets:
    routesPath: './assets/assets.routes'
    routesName: ASSET_ROUTES
    link: 'assets'
    title: 'Assets'
    icon: 'precision_manufacturing'
    privileges: '[]'
    pageNames: 'PageName.ASSETS'
    showStatusBox: false
    category: 'management'
spDatasets:
    routesPath: './dataset/dataset.routes'
    routesName: DATASET_ROUTES
    link: 'datasets'
    title: 'Datasets'
    icon: 'dataset'
    privileges: '[UserPrivilege.PRIVILEGE_READ_DATASET, UserPrivilege.PRIVILEGE_WRITE_DATASET]'
    pageNames: 'PageName.DATASETS'
    showStatusBox: false
    category: 'management'
spHome:
    routesPath: './home/home.routes'
    routesName: HOME_ROUTES
    link: ''
    title: 'Home'
    icon: 'home'
    pageNames: 'PageName.HOME'
    privileges: '[]'
    guard: 'canActivate: [ConfiguredCanActivateGuard], '
    showStatusBox: false
    category: 'top'
spConnect:
    routesPath: './connect/connect.routes'
    routesName: CONNECT_ROUTES
    link: 'connect'
    title: 'Adapters'
    icon: 'power'
    privileges: '[UserPrivilege.PRIVILEGE_READ_ADAPTER, UserPrivilege.PRIVILEGE_WRITE_ADAPTER]'
    pageNames: 'PageName.CONNECT'
    showStatusBox: true
    statusBox:
        link: "['connect']"
        assetLinkTypeId: 'adapter'
        createLinks: "['connect', 'catalog']"
        title: 'Adapters'
        createTitle: 'New adapter'
        dataFns: '[this.adapterService.getAdapterSummary()]'
        viewRoles: '[UserPrivilege.PRIVILEGE_READ_ADAPTER, UserPrivilege.PRIVILEGE_WRITE_ADAPTER]'
        createRoles: '[UserPrivilege.PRIVILEGE_WRITE_ADAPTER]'
    category: 'management'
spPipelines:
    routesPath: './pipelines/pipelines.routes'
    routesName: PIPELINES_ROUTES
    link: 'pipelines'
    title: 'Pipelines'
    icon: 'play_arrow'
    pageNames: 'PageName.PIPELINE_OVERVIEW'
    privileges: '[UserPrivilege.PRIVILEGE_READ_PIPELINE, UserPrivilege.PRIVILEGE_WRITE_PIPELINE]'
    showStatusBox: true
    statusBox:
        link: "['pipelines']"
        assetLinkTypeId: 'pipeline'
        createLinks: "['pipelines', 'create']"
        title: 'Pipelines'
        createTitle: 'New pipeline'
        dataFns: '[this.pipelineService.getPipelineSummary()]'
        viewRoles: '[UserPrivilege.PRIVILEGE_READ_PIPELINE, UserPrivilege.PRIVILEGE_WRITE_PIPELINE]'
        createRoles: '[UserPrivilege.PRIVILEGE_WRITE_PIPELINE]'
    category: 'analytics'
spConfiguration:
    routesPath: './configuration/configuration.routes'
    routesName: CONFIGURATION_ROUTES
    link: 'configuration'
    title: 'Settings'
    icon: 'settings'
    pageNames: 'PageName.SETTINGS'
    privileges: '[UserPrivilege.PRIVILEGE_WRITE_ASSETS, UserPrivilege.PRIVILEGE_WRITE_LABELS, UserPrivilege.PRIVILEGE_WRITE_FILES]'
    showStatusBox: false
    category: 'management'
spDashboard:
    routesPath: './dashboard/dashboard.routes'
    routesName: DASHBOARD_ROUTES
    link: 'dashboard'
    title: 'Dashboards'
    icon: 'dashboard'
    pageNames: 'PageName.DASHBOARD'
    privileges: '[UserPrivilege.PRIVILEGE_READ_DASHBOARD, UserPrivilege.PRIVILEGE_WRITE_DASHBOARD]'
    showStatusBox: true
    statusBox:
        link: "['dashboard']"
        assetLinkTypeId: 'dashboard'
        createLinks: "['dashboard']"
        title: 'Dashboards'
        createTitle: 'New dashboard'
        dataFns: '[this.dashboardService.getDashboardSummary()]'
        viewRoles: '[UserPrivilege.PRIVILEGE_READ_DASHBOARD, UserPrivilege.PRIVILEGE_WRITE_DASHBOARD]'
        createRoles: '[UserPrivilege.PRIVILEGE_WRITE_DASHBOARD]'
    category: 'visualization'
spChart:
    routesPath: './chart/chart.routes'
    routesName: CHART_ROUTES
    link: 'chart'
    title: 'Charts'
    description: 'The chart view lets you visually inspect historical data from your connected sources.'
    icon: 'query_stats'
    pageNames: 'PageName.DATA_EXPLORER'
    privileges: '[UserPrivilege.PRIVILEGE_READ_DATA_EXPLORER_VIEW, UserPrivilege.PRIVILEGE_WRITE_DATA_EXPLORER_VIEW]'
    showStatusBox: true
    statusBox:
        link: "['chart']"
        assetLinkTypeId: 'chart'
        createLinks: "['chart']"
        title: 'Charts'
        createTitle: 'New chart'
        dataFns: '[this.chartService.getChartSummary()]'
        viewRoles: '[UserPrivilege.PRIVILEGE_READ_DATA_EXPLORER_VIEW, UserPrivilege.PRIVILEGE_WRITE_DATA_EXPLORER_VIEW]'
        createRoles: '[UserPrivilege.PRIVILEGE_WRITE_DATA_EXPLORER_VIEW]'
    category: 'visualization'
