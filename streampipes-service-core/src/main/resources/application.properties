server.port=8030
server.servlet.context-path=/streampipes-backend
spring.servlet.multipart.max-file-size=5120MB
spring.servlet.multipart.max-request-size=5120MB
server.tomcat.additional-tld-skip-patterns=*.jar
spring.mvc.async.request-timeout=900000
streampipes.storage.cache.data-explorer-widgets.enabled=${SP_STORAGE_CACHE_DATA_EXPLORER_WIDGETS_ENABLED:true}
streampipes.storage.cache.permissions.enabled=${SP_STORAGE_CACHE_PERMISSIONS_ENABLED:true}
streampipes.storage.cache.adapters.enabled=${SP_STORAGE_CACHE_ADAPTERS_ENABLED:true}
streampipes.storage.cache.dashboards.enabled=${SP_STORAGE_CACHE_DASHBOARDS_ENABLED:true}
streampipes.storage.cache.pipelines.enabled=${SP_STORAGE_CACHE_PIPELINES_ENABLED:true}
streampipes.storage.cache.data-lake-measures.enabled=${SP_STORAGE_CACHE_DATA_LAKE_MEASURES_ENABLED:true}
spring.cache.type=caffeine
spring.cache.cache-names=dataExplorerWidgets,permissions,adapters,dashboards,pipelines,dataLakeMeasures
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m
logging.config=classpath:logback.xml
spring.output.ansi.enabled=always
springdoc.api-docs.path=/apidocs
app.version=@project.version@
