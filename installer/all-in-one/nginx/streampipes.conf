# Mirrors ui/nginx_config/default.conf, but serves on port 80 and proxies to
# the core and the extensions service running in the same container.

server {
  listen       80 default_server;
  server_name  _;

  root /usr/share/nginx/html;
  index index.html;

  access_log off;
  error_log /dev/stderr warn;

  include /etc/nginx/mime.types;
  # MapLibre's worker and shared ES module must be served as JavaScript.
  types {
    application/javascript mjs;
  }

  client_max_body_size 10240M;
  proxy_connect_timeout 10000;
  proxy_send_timeout    10000;
  proxy_read_timeout    10000;
  send_timeout          10000;

  # Revalidate the app shell and unversioned assets after deployments.
  location / {
    add_header Cache-Control "no-cache" always;

    # Angular production bundles have content hashes in their filenames.
    location ~ "^/[^/]+(?:-[A-Z0-9]{8}|\.[a-f0-9]{16,64})\.(?:js|css)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }

  location = /version.json {
    add_header Cache-Control "no-store" always;
  }

  gzip on;
  gzip_static on;
  gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;

  proxy_buffers 4 8k;
  proxy_buffer_size 8k;

  # StreamPipes core
  location /streampipes-backend {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
    proxy_pass http://127.0.0.1:8030;
    proxy_ssl_session_reuse off;
    proxy_set_header Host $http_host;
    proxy_redirect off;
  }

  # HTTP server adapter endpoints of the extensions service
  location ~/endpoints/(?<endpointName>.*)$ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
    proxy_pass http://127.0.0.1:8090/api/v1/worker/live/$endpointName;
    proxy_ssl_session_reuse off;
    proxy_set_header Host $http_host;
  }
}
