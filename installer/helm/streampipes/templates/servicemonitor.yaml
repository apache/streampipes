{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "streampipes.fullname" . }}
  labels:
    {{- include "streampipes.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.interval }}
  selector:
    matchLabels:
      {{- include "streampipes.selectorLabels" . | nindent 6 }}
{{- end }}