apiVersion: v1
kind: Service
metadata:
  name: {{ include "streampipes.extensions.fullname" . }}
  labels:
    {{- include "streampipes.extensions.labels" . | nindent 4 }}
spec:
  type: {{ .Values.extensions.service.type }}
  selector:
    {{ include "streampipes.extensions.selectorLabels" . | nindent 4 }}
  ports:
    - name: main
      protocol: TCP
      port: {{ .Values.extensions.service.port }}
      targetPort: {{ .Values.extensions.containerPort }}
  
  
