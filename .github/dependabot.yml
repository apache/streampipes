# Conventions used by every entry below:
# - Every update arrives as an individual PR so it can be reviewed on its own.
#   Patch releases of libraries (Maven, npm, pip) are skipped to keep the
#   number of PRs manageable; they come along with the next minor.
# - Majors of frameworks and runtimes that require a coordinated migration
#   (Angular, Spring Boot, JDK, databases) are ignored and upgraded by hand.
# - Cooldown delays new releases to protect against broken or compromised
#   versions. It does not apply to security updates.

version: 2
updates:
  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "java"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]
      # Spring Boot majors (and springdoc, which follows them) are migrated by hand
      - dependency-name: "org.springframework.boot:*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "org.springdoc:*"
        update-types: [ "version-update:semver-major" ]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14

  # ---------------------------------------------------------------------------
  # UI
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]
      # Angular majors are migrated by hand with `ng update`
      - dependency-name: "@angular/*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@angular-eslint/*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@ngbracket/ngx-layout"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "ng-packagr"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "npm"
    directories:
      - "/ui/projects/streampipes/platform-services"
      - "/ui/projects/streampipes/shared-ui"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]
      # Angular majors are migrated by hand with `ng update`
      - dependency-name: "@angular/*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@angular-eslint/*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@ngbracket/ngx-layout"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "ng-packagr"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14

  # ---------------------------------------------------------------------------
  # Clients
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/streampipes-client-python"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "gomod"
    directories:
      - "/streampipes-client-go"
      - "/streampipes-client-e2e/go-client-e2e"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14

  # ---------------------------------------------------------------------------
  # CI
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "gh-actions"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # Container images
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/ui"
      - "/streampipes-service-core"
      - "/streampipes-service-core-minimal"
      - "/streampipes-extensions/*"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    ignore:
      # JDK runtime majors are chosen deliberately (LTS releases only)
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7

  # The CLI under /installer/cli is deprecated (see installer/cli/README.md) and
  # deliberately not covered here; its images are not kept up to date.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/installer/compose"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "installer"
    ignore:
      # Majors of stateful services need data migrations and are upgraded by hand
      - dependency-name: "couchdb"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "influxdb"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "apache/kafka"
        update-types: [ "version-update:semver-major" ]
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
