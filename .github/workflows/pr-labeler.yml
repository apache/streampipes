name: "Pull Request Labeler"

on:
  workflow_run:
    workflows: ["PR label signal"]
    types: [completed]

permissions: {}

jobs:
  label-pr:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Find the current pull request
        id: pr
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('Invalid workflow head SHA');
            }
            // workflow_run.pull_requests can be empty for fork contributions.
            // Match the current head so superseded runs do not update labels.
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const numbers = pulls
              .filter(pr => pr.head.sha === sha &&
                !['octobot', 'dependabot[bot]'].includes(pr.user.login))
              .map(pr => pr.number);
            core.setOutput('numbers', numbers.join('\n'));

      - name: Checkout trusted label configuration
        if: steps.pr.outputs.numbers != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/pr-labeler-config.yml
          sparse-checkout-cone-mode: false

      - uses: actions/labeler@v7
        if: steps.pr.outputs.numbers != ''
        with:
          pr-number: ${{ steps.pr.outputs.numbers }}
          configuration-path: .github/pr-labeler-config.yml
          # Remove labels when matching files are reverted.
          sync-labels: true
