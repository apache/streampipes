name: PR Title Validation

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            deps
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            \#[0-9]+
            deps(-dev)?
          headerPattern: '^(\w*)(?:\(([\w$#.\-*/ ]*)\))?!?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
          subjectPattern: '^(?=.{1,100}$)(?!.*\.$).+$'
          subjectPatternError: >-
            The PR title subject must contain 1–100 characters and must not
            end with a period. The type and scope (e.g. "fix(#4937): ") do not count toward this limit.
