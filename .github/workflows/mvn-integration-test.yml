name: run-mvn-integration-tests

on:
  pull_request:


jobs:
  build_and_integration_test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
        with:
          version: latest
      - name: Install Maven
        run: |
          sudo apt update
          sudo apt install -y maven
      - name: Run IntegrationTest 
        run: mvn clean test -P selfsigned -Dtestcontainers.reuse.enable=true -Dtestcontainers.docker-client-timeout=60000 -Dtestcontainers.ryuk.container-startup-timeout=120000
        env:
          DOCKER_HOST: tcp://localhost:2375
